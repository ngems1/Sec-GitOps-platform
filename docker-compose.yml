# Week 3 - run the shop locally with Docker Compose.
#
#   docker compose up --build -d          build everything and start in the background
#   open http://localhost:8080            the shop
#   open http://localhost:8081/stock      inventoryservice stock API
#   docker compose --profile load up -d   also start the load generator
#   docker compose down                   stop (add -v to also wipe MySQL data)
#   Kubernetes instead of Compose: see docs/week3/LOCAL.md, part B
#
# Local stand-ins for the AWS services:
#   ElastiCache Redis -> redis container      RDS MySQL -> mysql container (db/migrations loaded at first start)
#   DynamoDB          -> DynamoDB Local       EventBridge / SQS / Lambda -> not run locally (tested on AWS dev)
# Full guide: docs/week3/LOCAL.md

name: boutique

x-common-env: &no-gcp
  # Online Boutique ships with Google Cloud profiling; switch it off locally. Tracing (ADR 0010) is
  # off unless ENABLE_TRACING=1 (no collector in this compose file).
  DISABLE_PROFILER: "1"
  ENABLE_TRACING: "0"

services:
  # ------------------------------------------------------------------ web entry
  frontend:
    build: ./src/frontend
    image: boutique/frontend:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    ports:
      - "8080:8080"
    environment:
      <<: *no-gcp
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      ENV_PLATFORM: local
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    restart: unless-stopped

  # ------------------------------------------------------------------ backend services (gRPC)
  productcatalogservice:
    build: ./src/productcatalogservice
    image: boutique/productcatalogservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "3550"
    restart: unless-stopped

  cartservice:
    build: ./src/cartservice/src
    image: boutique/cartservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      REDIS_ADDR: redis-cart:6379
    depends_on:
      - redis-cart
    restart: unless-stopped

  checkoutservice:
    build: ./src/checkoutservice
    image: boutique/checkoutservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    restart: unless-stopped

  currencyservice:
    build: ./src/currencyservice
    image: boutique/currencyservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "7000"
    restart: unless-stopped

  paymentservice:
    build: ./src/paymentservice
    image: boutique/paymentservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "50051"
    restart: unless-stopped

  shippingservice:
    build: ./src/shippingservice
    image: boutique/shippingservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "50051"
    restart: unless-stopped

  emailservice:
    build: ./src/emailservice
    image: boutique/emailservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "8080"
    restart: unless-stopped

  recommendationservice:
    build: ./src/recommendationservice
    image: boutique/recommendationservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      <<: *no-gcp
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
    depends_on:
      - productcatalogservice
    restart: unless-stopped

  adservice:
    build: ./src/adservice
    image: boutique/adservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    environment:
      PORT: "9555"
    restart: unless-stopped

  # ------------------------------------------------------------------ Week 3 addition
  inventoryservice:
    build: ./src/inventoryservice
    image: boutique/inventoryservice:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    ports:
      - "8081:8080" # REST API: http://localhost:8081/stock
    environment:
      PORT: "8080"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local          # DynamoDB Local accepts any credentials
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      INVENTORY_TABLE: boutique-local-inventory
      EVENT_BUS_NAME: local             # not used: the SQS consumer is off locally
      CONSUMER_ENABLED: "false"
      SEED_STOCK: "true"
      STOCK_OVERRIDES: "6E92ZMYYFZ:2"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ local stand-ins for AWS
  redis-cart: # ElastiCache
    image: redis:7-alpine
    restart: unless-stopped

  mysql: # RDS MySQL; db/migrations run automatically on the first start
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: boutique
      MYSQL_USER: boutique
      MYSQL_PASSWORD: boutique-local
      MYSQL_ROOT_PASSWORD: root-local
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-local"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  dynamodb: # DynamoDB
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped

  dynamodb-init: # creates the inventory table, then exits
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --endpoint-url http://dynamodb:8000 --table-name boutique-local-inventory >/dev/null 2>&1 \
          || aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
               --table-name boutique-local-inventory \
               --attribute-definitions AttributeName=pk,AttributeType=S \
               --key-schema AttributeName=pk,KeyType=HASH \
               --billing-mode PAY_PER_REQUEST >/dev/null
        echo "inventory table ready"

  # ------------------------------------------------------------------ optional
  loadgenerator: # docker compose --profile load up -d
    build: ./src/loadgenerator
    image: boutique/loadgenerator:local # also used by Docker Desktop Kubernetes (helm-chart/values-local.yaml)
    profiles: ["load"]
    environment:
      FRONTEND_ADDR: frontend:8080
      USERS: "5"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mysql-data:
