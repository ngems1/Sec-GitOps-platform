# dev (namespace boutique-dev): deployed automatically on every push to main.
# Kept small: one replica of each service.

# OpenTelemetry tracing (ADR 0010): on in dev only. RUNBOOK section 12 says how to turn it off.
tracing:
  enabled: true

# AI shopping assistant (ADR 0009): on in dev only, with the /assistant page in the frontend.
shoppingAssistantService:
  create: true

inventoryService:
  replicas: 1
  # The Mug starts with 2 in stock, so a 3-mug order shows the InventoryFailed path.
  stockOverrides: "6E92ZMYYFZ:2"

# Lower priority than prod, and never preempts.
guardrails:
  priority:
    value: 1000
    preemptionPolicy: Never
  # Room for every service at its autoscaling maximum plus a stress test (up to
  # 6 Locust pods of 300m), but never the whole cluster (4 x t3.medium = ~7.6 CPU
  # allocatable).
  quota:
    requests.cpu: "5"
    requests.memory: 6Gi
    limits.cpu: "20"
    limits.memory: 12Gi
    pods: "60"
