# Default values for onlineboutique.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  repository: gcr.io/google-samples/microservices-demo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccounts:
  # Specifies whether service accounts should be created.
  create: false
  # Annotations to add to the service accounts.
  annotations: {}
  # Annotations to add only for the cartservice app. This allows to follow the least privilege principle where only cartservice needs to connect to external database for example via Workload Identity.
  annotationsOnlyForCartservice: false

networkPolicies:
  # Specifies if the NetworkPolicies are created or not. If true, one fine granular NetworkPolicy per app is created.
  create: false

sidecars:
  # Specifies if the Sidecars are created or not. If true, one fine granular Sidecar per app is created.
  create: false

authorizationPolicies:
  # Specifies if the AuthorizationPolicies are created or not. If true, one fine granular AuthorizationPolicy per app is created.
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  # Specifies the project id for the otel collector. If set as "PROJECT_ID" (default value), an initContainer will automatically retrieve the project id value from the metadata server.
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

seccompProfile:
  enable: false
  type: RuntimeDefault

adService:
  create: true
  name: adservice
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 1000m      # Week 3: was 300m, too little for the JVM to start in time
      memory: 512Mi   # Week 3: was 300Mi (Java 21 runtime)

cartService:
  create: true
  name: cartservice
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 500m      # Week 3: was 300m (CPU-throttled in the stress test)
      memory: 128Mi

checkoutService:
  create: true
  name: checkoutservice
  # Week 3: order persistence + OrderCreated. Off while eventBusName is empty
  # (local runs); the deploy workflow fills these from Terraform on AWS.
  orders:
    awsRegion: us-east-1
    eventBusName: ""
    dbHost: ""
    dbPort: 3306
    dbName: ""
    dbSecretArn: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

currencyService:
  create: true
  name: currencyservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m      # Week 3: was 200m (CPU-throttled in the stress test)
      memory: 128Mi

emailService:
  create: true
  name: emailservice
  # Week 3: notification consumer. Empty = off (stock Online Boutique behaviour);
  # the deploy workflow fills these from Terraform.
  notifications:
    awsRegion: us-east-1
    queueUrl: ""     # SQS notification-q URL
    tableName: ""    # DynamoDB notifications table
    sesFromAddress: ""   # Amazon SES sender (terraform-aws/ses.tf); empty = log mode only
    sesRecipients: ""    # comma-separated verified recipients (SES sandbox)
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

inventoryService:
  # Week 3 addition. Off by default so the stock Online Boutique install still works;
  # turned on in values-aws.yaml; the deploy workflow adds the AWS names from Terraform.
  create: false
  name: inventoryservice
  replicas: 1
  awsRegion: us-east-1
  tableName: ""      # DynamoDB table, e.g. week3-boutique-dev-inventory
  queueUrl: ""       # SQS inventory-q URL
  eventBusName: ""   # EventBridge bus, e.g. week3-boutique-dev-events
  seedStock: true    # create stock rows for the 9 catalog products if missing
  defaultStock: 50
  stockOverrides: "6E92ZMYYFZ:2"  # Mug starts at 2, so a 3-mug order shows InventoryFailed
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

frontend:
  create: true
  name: frontend
  externalService: true
  cymbalBranding: false
  # One of: local, gcp, aws, azure, onprem, alibaba. When not set, defaults to "local" unless running in GKE, otherwise auto-sets to gcp.
  platform: local
  singleSharedSession: false
  # AWS: an Ingress for the AWS Load Balancer Controller, which creates one
  # internet-facing ALB per environment (templates/ingress.yaml).
  ingress:
    enabled: false
    className: alb
    # The ALB sends traffic and health checks straight to the pod IPs (target-type ip),
    # so the frontend NetworkPolicy lets in this range: the VPC.
    allowFromCidr: 10.0.0.0/16
    # HTTPS: ACM certificate ARN (set by the deploy workflow from terraform-aws/dns.tf).
    # Empty = plain http on port 80.
    certificateArn: ""
    annotations: {}
  virtualService:
    create: false
    hosts:
    - "*"
    gateway:
      name: asm-ingressgateway
      namespace: asm-ingress
      labelKey: asm
      labelValue: ingressgateway
  # Prometheus metrics of the HTTP traffic (frontend_http_*, src/frontend/metrics.go) on
  # their own port: scraped from the "monitoring" namespace, never behind the Service or ALB.
  metrics:
    port: 9090
  # Demo only: share (0-100) of requests answered with a 500, to show a failing canary
  # being rolled back (docs/week3/RUNBOOK.md section 10). Health checks are never faulted.
  faultInject500Percent: 0
  # Argo Rollouts canary (templates/frontend-rollout.yaml, ADR 0008). Needs the Argo Rollouts
  # controller (argocd-install) and Prometheus (deploy workflow, job "monitoring").
  canary:
    enabled: false
    # How traffic is split: "alb" = weighted target groups of the AWS Load Balancer
    # Controller (needs ingress.enabled). Istio (ambient + waypoints, D-05) can replace it later.
    trafficRouter: alb
    # Time-limited pauses only (an indefinite pause would hang the deploy). After the last
    # step the canary goes to 100%. Total ~5-6 min, inside the deploy-env Argo CD wait.
    steps:
      - setWeight: 20
      - pause: { duration: 2m }
      - setWeight: 50
      - pause: { duration: 2m }
    # Background analysis on the canary pods only (Prometheus): a failure aborts the canary,
    # no data is a failure too (the loadgenerator keeps steady traffic through the ALB);
    # traffic goes back to stable.
    analysis:
      enabled: true
      prometheusAddress: http://prometheus-operated.monitoring.svc:9090
      minSuccessRate: 0.99   # share of non-5xx answers
      maxP95Seconds: 1       # p95 latency (the shop's latency SLO)
      interval: 30s
      initialDelay: 90s      # first scrapes + the 1-minute rate window
      minRequests: 10        # requests the canary must have served in volumeWindow, else fail
      volumeWindow: 2m
      failureLimit: 1        # a second failed measurement aborts
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m      # Week 3: was 200m (CPU-throttled in the stress test)
      memory: 128Mi

loadGenerator:
  create: true
  name: loadgenerator
  checkFrontendInitContainer: true
  users: 10                # simulated shoppers (each ~1 request every 1-10 s)
  browseOnly: false        # true = no cart writes and no orders (LOADGEN_BROWSE_ONLY)
  # Full URL to shop through (e.g. https://dev.example.com, the ALB). Empty = the in-cluster
  # frontend Service, which never reaches an Argo Rollouts canary.
  frontendUrl: ""
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

paymentService:
  create: true
  name: paymentservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

productCatalogService:
  create: true
  name: productcatalogservice
  # Specifies an extra latency to any request on productcatalogservice, by default no extra latency.
  extraLatency: ""
  # Week 3: catalog from RDS MySQL with a Redis cache. Empty dbSecretArn = products.json
  # only (stock Online Boutique behaviour); the deploy workflow fills these from Terraform.
  catalog:
    awsRegion: us-east-1
    dbHost: ""
    dbPort: "3306"
    dbName: ""
    dbSecretArn: ""
    redisAddr: ""     # ElastiCache endpoint host:port (same cluster as the carts)
    cacheTtl: 5m      # how long a catalog read from MySQL stays in Redis
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m      # Week 3: was 200m (CPU-throttled in the stress test)
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 500m      # Week 3: was 200m (CPU-throttled in the stress test)
      memory: 450Mi

shippingService:
  create: true
  name: shippingservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Redis encryption in transit + auth token (ElastiCache). Used by cartservice and the
# productcatalogservice cache. Off for the in-cluster/local Redis.
redisAuth:
  tls: false
  secretName: ""   # Kubernetes Secret with key "token" (created by the deploy workflow)

cartDatabase:
  # Specifies the type of the cartservice's database, could be either redis or spanner.
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true
  externalRedisTlsOrigination:
    enable: false
    name: exernal-redis-tls-origination
    endpointAddress: ""
    endpointPort: ""
    certificate: ""

# Week 3: HorizontalPodAutoscaler (templates/hpa.yaml). Off by default (local runs);
# turned on for EKS in values-aws.yaml. Needs metrics-server (Helm chart, deploy-env.yml).
autoscaling:
  enabled: false
  # Add replicas when the average CPU of the pods goes above this % of their CPU *request*.
  targetCPUUtilization: 70
  # Wait this long at lower CPU before removing replicas (avoids flapping).
  scaleDownStabilizationSeconds: 120
  # Deployment name -> replica range. The Deployments must not set "replicas" themselves.
  targets: {}

# PriorityClass per namespace (templates/priorityclass.yaml), sized in values-<env>.yaml.
# Namespace guardrails (templates/guardrails.yaml, templates/_helpers.tpl): ResourceQuota,
# LimitRange, PodDisruptionBudgets, priorityClassName, zone/node spread and a preStop pause.
# Off locally; on for EKS (values-aws.yaml), with per-environment sizes (values-<env>.yaml).
guardrails:
  enabled: false
  preStopSeconds: 5
  priority:
    # Never in the release (cluster-scoped): deploy-env.yml sets it to render only
    # templates/priorityclass.yaml and applies that with the namespace.
    render: false
    value: 1000
    preemptionPolicy: Never
  quota: {}
  containerDefaults:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  containerMax: { cpu: "2", memory: 1Gi }
