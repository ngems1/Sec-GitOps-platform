# EKS values shared by dev and prod.
#
# The deploy workflow stacks three files, the last one wins:
#   values-aws.yaml            this file: the AWS setup common to both environments
#   values-dev.yaml / -prod    what differs between the environments
#   (generated)                names Terraform created for that environment: ECR registry,
#                              Redis endpoint, DynamoDB table, queue URL, event bus, VPC range
# and the image tag (the commit SHA) with --set images.tag=...

serviceAccounts:
  # One service account per service. Terraform links 4 of them to IAM roles with
  # EKS Pod Identity (checkoutservice, productcatalogservice, inventoryservice,
  # emailservice); the others get no AWS access at all.
  create: true

networkPolicies:
  # A deny-all policy plus one policy per service: each service only accepts
  # traffic from the services that call it (enforced by the VPC CNI).
  create: true

seccompProfile:
  enable: true
  type: RuntimeDefault

frontend:
  externalService: false   # no classic LoadBalancer Service...
  platform: aws
  ingress:
    enabled: true          # ...an ALB from the Ingress instead (templates/ingress.yaml)
  canary:
    enabled: true          # Argo Rollouts canary through the ALB (ADR 0008), dev and prod
  resources:
    requests: { cpu: 55m } # right-sized (RUNBOOK section 13); memory and limits: values.yaml

redisAuth:
  tls: true                # ElastiCache requires TLS (transit_encryption_mode = required)
  secretName: redis-auth   # created per namespace by deploy-env.yml from the Terraform state

cartDatabase:
  type: redis
  inClusterRedis:
    create: false          # ElastiCache Redis (address set by the workflow)

inventoryService:
  create: true             # table, queue and bus names set by the workflow
  resources:
    requests: { cpu: 25m } # right-sized (RUNBOOK section 13)

# Right-sized requests for dev and prod (RUNBOOK section 13), from cluster-status "Resource
# usage" (about 6 h at 15 users). Requests only: Helm merges them over values.yaml, so limits
# and any memory request not listed here stay as they are. HPA services (frontend above,
# currency, catalog, cart, recommendation): about 2.5 x their CPU p95. The others: 25m floor.
# Memory: above the measured maximum. Unchanged: adservice, loadgenerator, shoppingassistantservice.
currencyService:
  resources:
    requests: { cpu: 45m, memory: 112Mi }
productCatalogService:
  resources:
    requests: { cpu: 60m }
cartService:
  resources:
    requests: { cpu: 60m, memory: 96Mi }
recommendationService:
  resources:
    requests: { cpu: 25m, memory: 96Mi }
checkoutService:
  resources:
    requests: { cpu: 25m }
shippingService:
  resources:
    requests: { cpu: 25m }
emailService:
  resources:
    requests: { cpu: 25m, memory: 112Mi }
paymentService:
  resources:
    requests: { cpu: 25m, memory: 80Mi }

loadGenerator:
  # Steady, read-only shoppers through the ALB (frontendUrl, written by deploy-env.yml into
  # gitops/<env>/values.yaml), so the frontend canary analysis always has traffic to judge
  # (ADR 0008). No orders, no cart writes.
  # 15 users = about 2.1 requests/s (about 0.14 per user, measured: Locust waits 1-10 s between
  # tasks). The canary's request-volume gate needs it: at 20% weight the first check sees about
  # 0.42/s x 90 s = 38 requests, 3.8x the minimum of 10. CI checks this (helm job). The CPU
  # request below is unchanged; Locust uses far less than its 250m limit at this rate.
  create: true
  browseOnly: true
  users: 15
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Week 3: autoscaling (templates/hpa.yaml). The stress test showed single pods capped by
# their CPU limit while the nodes were only ~40% busy: these services get more replicas
# under load. Ranges are small on purpose: every pod uses node capacity.
autoscaling:
  enabled: true
  targets:
    frontend:              { min: 1, max: 4 }
    currencyservice:       { min: 1, max: 4 }
    productcatalogservice: { min: 1, max: 3 }
    cartservice:           { min: 1, max: 3 }
    recommendationservice: { min: 1, max: 3 }


# Guardrails on for EKS. Quotas and priorities are set per environment.
guardrails:
  enabled: true
