{{- /*
PriorityClass named after the namespace: prod outranks dev and may preempt it;
dev never preempts anything. Pods use it through "boutique.podGuardrails".

It is cluster-scoped, so the release never renders it: the Argo CD project
"boutique" allows no cluster-wide objects. deploy-env.yml renders this file alone
(--show-only, guardrails.priority.render=true) and applies it with the namespace.
*/ -}}
{{- if and .Values.guardrails.enabled .Values.guardrails.priority.render }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Release.Namespace }}
value: {{ .Values.guardrails.priority.value }}
preemptionPolicy: {{ .Values.guardrails.priority.preemptionPolicy }}
globalDefault: false
description: "Pods of {{ .Release.Namespace }}"
{{- end }}
