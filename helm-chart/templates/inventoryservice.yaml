{{- if .Values.inventoryService.create }}
{{- if .Values.serviceAccounts.create }}
# AWS access comes from EKS Pod Identity: Terraform links this service account
# (in this namespace) to the environment's inventory IAM role. No annotation needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.inventoryService.name }}
spec:
  replicas: {{ .Values.inventoryService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.inventoryService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.inventoryService.name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.inventoryService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      # long-poll is 20 s; give the consumer time to finish its current batch
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ .Values.images.repository }}/{{ .Values.inventoryService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: AWS_REGION
          value: {{ .Values.inventoryService.awsRegion | quote }}
        - name: INVENTORY_TABLE
          value: {{ required "inventoryService.tableName is required" .Values.inventoryService.tableName | quote }}
        - name: INVENTORY_QUEUE_URL
          value: {{ required "inventoryService.queueUrl is required" .Values.inventoryService.queueUrl | quote }}
        - name: EVENT_BUS_NAME
          value: {{ required "inventoryService.eventBusName is required" .Values.inventoryService.eventBusName | quote }}
        - name: SEED_STOCK
          value: {{ .Values.inventoryService.seedStock | quote }}
        - name: DEFAULT_STOCK
          value: {{ .Values.inventoryService.defaultStock | quote }}
        - name: STOCK_OVERRIDES
          value: {{ .Values.inventoryService.stockOverrides | quote }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml .Values.inventoryService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.inventoryService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.inventoryService.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.inventoryService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.inventoryService.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # REST API: pods in the same namespace only. Metrics: the monitoring namespace.
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - {} # DynamoDB, SQS and EventBridge are reached over HTTPS
{{- end }}
{{- end }}
