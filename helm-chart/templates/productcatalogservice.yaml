{{- if .Values.productCatalogService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{.Release.Namespace}}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.productCatalogService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.productCatalogService.name }}
      {{- if .Values.productCatalogService.catalog.dbSecretArn }}
      annotations:
        # Week 3: cache metrics for Prometheus (namespace "monitoring")
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.productCatalogService.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      terminationGracePeriodSeconds: 15
      {{- include "boutique.podGuardrails" (dict "root" $ "app" .Values.productCatalogService.name) | nindent 6 }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ .Values.images.repository }}/{{ .Values.productCatalogService.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
        {{- if .Values.guardrails.enabled }}
        # Keep serving a few seconds after removal from the Service endpoints,
        # so in-flight calls finish during a rollout (no errors on deploy).
        lifecycle:
          preStop:
            sleep:
              seconds: {{ .Values.guardrails.preStopSeconds }}
        {{- end }}
        ports:
        - containerPort: 3550
        {{- if .Values.productCatalogService.catalog.dbSecretArn }}
        - name: metrics
          containerPort: 9090
        {{- end }}
        env:
        - name: PORT
          value: "3550"
        {{- if .Values.opentelemetryCollector.create }}
        - name: COLLECTOR_SERVICE_ADDR
          value: "{{ .Values.opentelemetryCollector.name }}:4317"
        {{- end }}
        {{- if .Values.googleCloudOperations.tracing }}
        - name: ENABLE_TRACING
          value: "1"
        {{- end }}
        {{- if not .Values.googleCloudOperations.profiler }}
        - name: DISABLE_PROFILER
          value: "1"
        {{- end }}
        - name: EXTRA_LATENCY
          value: {{ .Values.productCatalogService.extraLatency }}
        {{- with .Values.productCatalogService.catalog }}
        {{- if .dbSecretArn }}
        # Week 3: catalog from RDS MySQL with a Redis cache (AWS access via Pod Identity)
        - name: AWS_REGION
          value: {{ .awsRegion | quote }}
        - name: DB_HOST
          value: {{ required "productCatalogService.catalog.dbHost is required" .dbHost | quote }}
        - name: DB_PORT
          value: {{ .dbPort | quote }}
        - name: DB_NAME
          value: {{ .dbName | quote }}
        - name: DB_SECRET_ARN
          value: {{ .dbSecretArn | quote }}
        - name: REDIS_ADDR
          value: {{ .redisAddr | quote }}
        {{- if $.Values.redisAuth.tls }}
        - name: REDIS_TLS
          value: "true"
        {{- end }}
        {{- if $.Values.redisAuth.secretName }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.redisAuth.secretName | quote }}
              key: token
        {{- end }}
        - name: CATALOG_CACHE_TTL
          value: {{ .cacheTtl | quote }}
        {{- end }}
        {{- end }}
        readinessProbe:
          timeoutSeconds: 3
          grpc:
            port: 3550
        livenessProbe:
          # Week 3: under heavy load a CPU-throttled pod answers its health check slowly;
          # the defaults (1 s timeout, 3 failures) can then restart a pod that is only busy.
          timeoutSeconds: 5
          failureThreshold: 6
          grpc:
            port: 3550
        resources:
          {{- toYaml .Values.productCatalogService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.productCatalogService.name }}
  ports:
  - name: grpc
    port: 3550
    targetPort: 3550
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.productCatalogService.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.frontend.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.checkoutService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.recommendationService.name }}
    {{- if .Values.shoppingAssistantService.create }}
    # the AI shopping assistant's read-only catalog tools (ADR 0009)
    - podSelector:
        matchLabels:
          app: {{ .Values.shoppingAssistantService.name }}
    {{- end }}
    ports:
     - port: 3550
       protocol: TCP
  {{- if .Values.productCatalogService.catalog.dbSecretArn }}
  # Week 3: cache metrics, for Prometheus only
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090
      protocol: TCP
  {{- end }}
  egress:
  - {}
{{- end }}
{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.productCatalogService.name }}
  egress:
  - hosts:
    - istio-system/*
    {{- if .Values.opentelemetryCollector.create }}
    - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
{{- end }}
{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.productCatalogService.name }}
  rules:
  - from:
    - source:
        principals:
        {{- if .Values.serviceAccounts.create }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.frontend.name }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.checkoutService.name }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.recommendationService.name }}
        {{- else }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/default
        {{- end }}
    to:
    - operation:
        paths:
        - /hipstershop.ProductCatalogService/GetProduct
        - /hipstershop.ProductCatalogService/ListProducts
        methods:
        - POST
        ports:
        - "3550"
{{- end }}
{{- end }}
