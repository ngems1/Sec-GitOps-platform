{{- if and .Values.frontend.create .Values.frontend.ingress.enabled (eq .Values.frontend.ingress.provider "alb") }}
{{- $canaryAlb := and .Values.frontend.canary.enabled (eq .Values.frontend.canary.trafficRouter "alb") }}
# Week 3: public entry point on AWS. The AWS Load Balancer Controller (kube-system)
# sees this Ingress and creates one internet-facing ALB for this namespace,
# named after the namespace (boutique-dev / boutique-prod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Release.Namespace | trunc 32 | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /_healthz
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: {{ printf "Namespace=%s" .Release.Namespace | quote }}
    {{- with .Values.frontend.ingress.certificateArn }}
    # Week 3: HTTPS with the ACM certificate of our domain (terraform-aws/dns.tf).
    # Port 80 only redirects to 443; TLS 1.2+ only.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- end }}
    {{- if $canaryAlb }}
    # Argo Rollouts canary (frontend-rollout.yaml): the backend below is this forward action,
    # whose weights the Rollouts controller sets (stable / canary target groups). The value
    # here is only the start: 100% stable. Argo CD ignores later changes to it.
    alb.ingress.kubernetes.io/actions.{{ .Values.frontend.name }}: {{ printf "{\"type\":\"forward\",\"forwardConfig\":{\"targetGroups\":[{\"serviceName\":\"%s\",\"servicePort\":\"80\",\"weight\":100}]}}" .Values.frontend.name | squote }}
    {{- end }}
    {{- with .Values.frontend.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.frontend.name }}
            port:
              {{- if $canaryAlb }}
              name: use-annotation
              {{- else }}
              number: 80
              {{- end }}
{{- end }}
