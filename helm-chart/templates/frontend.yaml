{{- if .Values.frontend.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{.Release.Namespace}}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
# With frontend.canary.enabled this Deployment only holds the pod template: the Rollout
# "frontend" (frontend-rollout.yaml) points at it (workloadRef), runs the pods and scales
# this Deployment down to 0 (Argo CD ignores its replicas). Its pods, labels and guardrails
# stay exactly the same.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        # HTTP metrics for Prometheus (namespace "monitoring"), used by the canary analysis.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.frontend.metrics.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.frontend.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- include "boutique.podGuardrails" (dict "root" $ "app" .Values.frontend.name) | nindent 6 }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: {{ .Values.images.repository }}/{{ .Values.frontend.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
          ports:
          - containerPort: 8080
          - name: metrics
            containerPort: {{ .Values.frontend.metrics.port }}
          readinessProbe:
            timeoutSeconds: 3
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            # Week 3: under heavy load a CPU-throttled pod answers its health check slowly;
            # the defaults (1 s timeout, 3 failures) can then restart a pod that is only busy.
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          # Week 3: on shutdown, keep serving 15 s while the ALB deregisters this pod,
          # so no request lands on a pod that is already gone (zero-downtime rollout).
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          env:
          - name: PORT
            value: "8080"
          - name: METRICS_PORT
            value: {{ .Values.frontend.metrics.port | quote }}
          {{- if gt (int .Values.frontend.faultInject500Percent) 0 }}
          # Demo of a failing canary only (docs/week3/RUNBOOK.md section 10).
          - name: FAULT_INJECT_500_PERCENT
            value: {{ .Values.frontend.faultInject500Percent | quote }}
          {{- end }}
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "{{ .Values.productCatalogService.name }}:3550"
          - name: CURRENCY_SERVICE_ADDR
            value: "{{ .Values.currencyService.name }}:7000"
          - name: CART_SERVICE_ADDR
            value: "{{ .Values.cartService.name }}:7070"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "{{ .Values.recommendationService.name }}:8080"
          - name: SHIPPING_SERVICE_ADDR
            value: "{{ .Values.shippingService.name }}:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "{{ .Values.checkoutService.name }}:5050"
          - name: AD_SERVICE_ADDR
            value: "{{ .Values.adService.name }}:9555"
          {{- if .Values.shoppingAssistantService.create }}
          # AI shopping assistant (ADR 0009): the /assistant page and header link appear only
          # when this is set.
          - name: ASSISTANT_URL
            value: "http://{{ .Values.shoppingAssistantService.name }}"
          {{- end }}
          - name: ENV_PLATFORM
            value: {{ .Values.frontend.platform | quote }}
          {{- with (include "boutique.tracingEnv" (dict "root" $ "name" .Values.frontend.name)) }}{{ . | nindent 10 }}{{ end }}
          {{- if .Values.googleCloudOperations.profiler }}
          - name: ENABLE_PROFILER
            value: "1"
          {{- end }}
          - name: CYMBAL_BRANDING
            value: {{ .Values.frontend.cymbalBranding | quote }}
          - name: ENABLE_SINGLE_SHARED_SESSION
            value: {{ .Values.frontend.singleSharedSession | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
  {{- if and .Values.frontend.ingress.enabled (eq .Values.frontend.ingress.provider "gce") }}
  annotations:
    # GKE Ingress (ingress-gce.yaml): load balancing straight to the pods (NEGs), with the
    # BackendConfig's health check. The Service stays ClusterIP.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: {{ printf "{\"default\": \"%s\"}" .Values.frontend.name | squote }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.frontend.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- if .Values.frontend.externalService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}-external
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.frontend.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- end }}
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- if .Values.frontend.externalService }}
  - {}
  {{- else if and .Values.frontend.ingress.enabled (eq .Values.frontend.ingress.provider "alb") }}
  # ALB (ip targets): traffic and health checks come from inside the VPC.
  - from:
    - ipBlock:
        cidr: {{ .Values.frontend.ingress.allowFromCidr }}
    ports:
     - port: 8080
       protocol: TCP
  {{- else }}
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.loadGenerator.name }}
    {{- if .Values.frontend.virtualService.create }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.frontend.virtualService.gateway.namespace }}
      podSelector:
        matchLabels:
          {{ .Values.frontend.virtualService.gateway.labelKey }}: {{ .Values.frontend.virtualService.gateway.labelValue }}
    {{- end }}
    ports:
     - port: 8080
       protocol: TCP
  {{- if and .Values.frontend.ingress.enabled (eq .Values.frontend.ingress.provider "gce") }}
  # GKE Ingress (container-native): the shop's traffic and the health checks reach the pods
  # from Google's load balancers (the Google Front End and health checkers), these ranges only.
  - from:
    {{- range .Values.frontend.ingress.gce.sourceRanges }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
     - port: 8080
       protocol: TCP
  {{- end }}
  {{- end }}
  {{- $scrapers := .Values.frontend.metrics.scrapeNamespaces }}
  {{- if eq (len $scrapers) 1 }}
  # Metrics: Prometheus in the {{ first $scrapers }} namespace only.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ first $scrapers }}
  {{- else }}
  # Metrics: the scrapers' namespaces only ({{ join ", " $scrapers }}).
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ toJson $scrapers }}
  {{- end }}
    ports:
    - port: {{ .Values.frontend.metrics.port }}
      protocol: TCP
  egress:
  - {}
{{- end }}
{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.frontend.name }}
  egress:
  - hosts:
    - istio-system/*
    - ./{{ .Values.adService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.cartService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.checkoutService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.currencyService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.productCatalogService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.recommendationService.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.shippingService.name }}.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  rules:
  {{- if .Values.frontend.externalService }}
  - to:
  {{- else }}
  - from:
    - source:
        principals:
        {{- if .Values.serviceAccounts.create }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.loadGenerator.name }}
        {{- else }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/default
        {{- end }}
        {{- if .Values.frontend.virtualService.create }}
        - cluster.local/ns/{{ .Values.frontend.virtualService.gateway.namespace }}/sa/{{ .Values.frontend.virtualService.gateway.name }}
        {{- end }}
    to:
  {{- end }}
    - operation:
        methods:
        - GET
        - POST
        ports:
        - "8080"
{{- end }}
{{- if .Values.frontend.virtualService.create }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.frontend.virtualService.hosts }}
  hosts:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  gateways:
  - {{ .Values.frontend.virtualService.gateway.namespace }}/{{ .Values.frontend.virtualService.gateway.name }}
  http:
  - route:
    - destination:
        host: {{ .Values.frontend.name }}
        port:
          number: 80
{{- end }}
{{- end }}
