{{- /*
Namespace guardrails (on for EKS, see values-aws.yaml and values-<env>.yaml):
- ResourceQuota: dev can never take the whole cluster (a stress test in dev
  cannot starve prod).
- LimitRange: default requests/limits for containers that set none (the
  db-migrate Job, the isolation probe), so the quota always applies.
- PodDisruptionBudgets: at most one pod of a service is evicted at a time during
  node drains and upgrades. maxUnavailable (not minAvailable) on purpose: a
  one-replica service never blocks a drain or the nightly destroy.
*/ -}}
{{- if .Values.guardrails.enabled }}
{{- with .Values.guardrails }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $.Release.Namespace }}-quota
  namespace: {{ $.Release.Namespace }}
spec:
  hard:
    {{- toYaml .quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $.Release.Namespace }}-defaults
  namespace: {{ $.Release.Namespace }}
spec:
  limits:
  - type: Container
    defaultRequest:
      {{- toYaml .containerDefaults.requests | nindent 6 }}
    default:
      {{- toYaml .containerDefaults.limits | nindent 6 }}
    max:
      {{- toYaml .containerMax | nindent 6 }}
{{- end }}
{{- range $key := list "adService" "cartService" "checkoutService" "currencyService" "emailService" "frontend" "inventoryService" "paymentService" "shoppingAssistantService" "productCatalogService" "recommendationService" "shippingService" }}
{{- $svc := index $.Values $key }}
{{- if $svc.create }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $svc.name }}
{{- end }}
{{- end }}
{{- end }}
