# prod (namespace boutique-prod): same images as dev, deployed after a reviewer
# approves the "prod" environment in GitHub.

# Steady traffic for the frontend canary analysis (values-aws.yaml: browse only, no orders).
# Same as dev: 15 users, about 2.1 requests/s. At 20% weight the canary gets about 0.42/s, so the
# first request-volume check (90 s of canary traffic) expects about 38 requests for a gate of 10
# (5 users gave about 12.6 and aborted a healthy canary). Math: RUNBOOK section 10.
loadGenerator:
  users: 15

# OpenTelemetry tracing (ADR 0010, step 7, 2026-10-18): on in prod, as in dev, for the 12
# services. The collector keeps errors, traces over 1 s and 10% of the rest for boutique-prod
# (tail sampling by k8s.namespace.name); span metrics count every span. Off fast: false here,
# through the prod promotion (RUNBOOK section 12, "Turn prod tracing off fast").
tracing:
  enabled: true

# adservice with the OpenTelemetry Java agent on: about 190 MiB measured in dev against 110-115
# MiB without it, so the memory request covers it, as in dev (values-dev.yaml). The limit (512Mi)
# and the CPU request do not change.
adService:
  resources:
    requests:
      memory: 256Mi

# AI shopping assistant (ADR 0009): on in prod after 2 days in dev. The frontend gets its
# /assistant page (ASSISTANT_URL) from this flag. Off fast: create: false here (through the
# prod promotion), or dailyQuestionCap: 0 (the kill switch). RUNBOOK section 15.
# Its Pod Identity role exists in both environments (Terraform). Same model and limits as dev
# (values.yaml); only the daily cap differs:
#   worst case per question: 4 model calls (3 tool steps + answer), about 10,700 input and
#   2,400 output tokens = about USD 0.0012 with Nova Lite (typical: USD 0.0004);
#   the USD 1/day Bedrock budget is account-wide (dev + prod):
#   dev 300 x 0.0012 = 0.37 + prod 100 x 0.0012 = 0.12 -> USD 0.49 worst case, under the
#   budget's 50% alert. The cap is per pod and UTC day, and in memory: a pod restart or a
#   rollout's new pod starts from 0, so the real bound is cap x pods started that day.
#   CI keeps dev + prod caps at 400 or less.
shoppingAssistantService:
  create: true
  dailyQuestionCap: 100

inventoryService:
  # Two consumers on the inventory queue. Safe because reservations are
  # idempotent (DynamoDB transaction keyed by order ID).
  replicas: 2
  stockOverrides: ""   # normal stock for every product

# Higher priority: on a full cluster prod pods are scheduled first and may
# preempt dev pods.
guardrails:
  priority:
    value: 100000
    preemptionPolicy: PreemptLowerPriority
  # Every service at its autoscaling maximum plus one extra pod each during a rollout.
  quota:
    requests.cpu: "5"
    requests.memory: 5Gi
    # 20, not 16: at autoscaling maximum plus one surge pod per Deployment the limits
    # add up to 15.2 CPU, too close to 16 for a rollout during a load peak.
    limits.cpu: "20"
    limits.memory: 8Gi
    pods: "50"
