# kube-prometheus-stack, installed by the deploy workflow (job "monitoring") into the
# "monitoring" namespace. Sized for 4 x t3.medium: short retention, small requests.
#
#   Prometheus  scrapes the cluster: pods (CPU, memory, restarts, readiness through
#               kube-state-metrics and the kubelet), nodes (node-exporter) and the
#               services that expose /metrics (prometheus.io/* pod annotations:
#               inventoryservice, productcatalogservice, frontend: frontend_http_*, used
#               by the Argo Rollouts canary analysis, ADR 0008).
#   Grafana     dashboards: the "Boutique" dashboard (monitoring/dashboards) plus the
#               chart's Kubernetes dashboards. Data sources: Prometheus, Tempo (traces, ADR 0010) and CloudWatch
#               (ALB, SQS, RDS) through a read-only Pod Identity role (terraform-aws/monitoring.tf).
#
# Alertmanager is off: alerts already go CloudWatch -> SNS -> Slack (#boutique-alerts).

alertmanager:
  enabled: false

# Control-plane components EKS manages itself: nothing to scrape, avoid "down" targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  # No admission webhooks: one less component (and certificate job) to run.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus:
  prometheusSpec:
    retention: 24h            # lab: one day of history, kept in memory/emptyDir
    scrapeInterval: 30s
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1200Mi }
    # Exemplars (ADR 0011, PR 6): the trace IDs the OTel Collector puts on the span-metric
    # histogram buckets (traces_spanmetrics_latency_bucket), kept so Grafana can link a latency
    # point to its trace in Tempo (the Prometheus data source below). An in-memory ring buffer
    # of maxSize exemplars for all series: about 18 MiB of heap when full at 100000 (measured,
    # RUNBOOK section 12), lost at a restart like the rest of the in-memory data. The flag is a
    # container argument: changing it restarts Prometheus; maxSize is in the config file
    # (reloaded, no restart).
    # Scrape protocol: Prometheus 3.14 asks for OpenMetrics first (its default: no
    # scrapeProtocols set here); the classic text format has no exemplars. CI checks both.
    enableFeatures:
      - exemplar-storage
    exemplars:
      maxSize: 100000
    # Scrape every pod that asks for it with prometheus.io/* annotations.
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # Argo Rollouts: which ReplicaSet (stable or canary) a pod belongs to, so the
          # frontend canary analysis can measure the canary pods alone.
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: rollouts_pod_template_hash
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

grafana:
  # Pod Identity links this service account to the CloudWatch read-only role.
  serviceAccount:
    create: true
    name: grafana
  admin:
    existingSecret: grafana-admin   # created by the workflow from GRAFANA_ADMIN_PASSWORD
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    # The image already contains the data source plugins we use (Prometheus, CloudWatch...).
    # By default Grafana also tries at startup to update these bundled plugins from the
    # internet: it stops the plugin, then fails to replace it on the read-only disk
    # ("unlinkat ... plugins-bundled ... read-only file system"), and the plugin stays
    # stopped. That is why the Prometheus data source was "not found". No updates at
    # runtime: plugin versions change only when the Grafana image changes.
    plugins:
      preinstall_disabled: true
      preinstall_auto_update: false
  # Week 3: 384Mi was too little: Grafana was OOMKilled during the stress test (the 503
  # page) and again later with the whole dashboard open. Grafana 13 needs more.
  # 2026-10-17 (cluster-status Resource usage): max 540Mi, so the request covers it (was 256Mi).
  resources:
    requests: { cpu: 100m, memory: 576Mi }
    limits: { memory: 768Mi }
  defaultDashboardsTimezone: browser
  # No "plugins:" list here either: it would make Grafana replace a bundled plugin at
  # startup, fail on the read-only disk and exit (see grafana.ini > plugins above).
  # Both data sources are created here, with fixed IDs the dashboard uses. The chart's
  # automatic Prometheus data source is turned off (it was not created in the installed
  # chart version, and two data sources with the same ID would conflict).
  additionalDataSources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      # The chart's own Prometheus Service: <fullname>-prometheus, and the fullname of
      # release "monitoring" is "monitoring-kube-prometheus" (deploy/monitoring.sh). The same
      # address as the frontend canary analysis (helm-chart/values.yaml, prometheusAddress);
      # CI renders this chart and checks both against the Service it really creates.
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
      isDefault: true
      jsonData:
        timeInterval: 30s          # = scrapeInterval
        # Exemplars (ADR 0011, PR 6): an exemplar's trace_id label opens that trace in Tempo
        # (the "Exemplars" toggle in Explore, RUNBOOK section 12). An internal link by data
        # source UID: no URL and no ${...} variable here. CI checks this block.
        exemplarTraceIdDestinations:
          - name: trace_id
            datasourceUid: tempo
    # Traces (ADR 0010): Tempo, installed by deploy/monitoring.sh next to this chart. Tempo is a
    # core Grafana data source (no plugin). Its NetworkPolicy lets only Grafana query it (3200).
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
      # Trace -> logs (ADR 0011, PR 4). Grafana's own "Logs for this span" link (tracesToLogsV2)
      # does not support CloudWatch: Grafana 13.2 builds it for Loki, Splunk, Elasticsearch,
      # OpenSearch, Falcon LogScale, Google Cloud Logging and VictoriaMetrics Logs only. Instead a
      # correlation: on Tempo's search results table in Explore, each traceID links to a Logs
      # Insights query of the application log group for that trace (RUNBOOK section 12). The
      # "Logs and traces" dashboard has the same links. CI checks this block.
      # $${...}: Grafana expands ${...} in provisioning files as environment variables (it emptied
      # these in a test); $$ keeps a literal $ for the correlation's own variables.
      correlations:
        - targetUID: cloudwatch
          label: Logs for this trace (CloudWatch)
          description: Application log lines with this trace_id (all 12 services log it, ADR 0011)
          type: query
          config:
            field: traceID
            target:
              queryMode: Logs
              region: default
              logGroupNames:
                - /aws/containerinsights/week3-boutique-eks/application
              expression: >-
                parse kubernetes.pod_name /^(?<pod_service>.+)-[a-z0-9]{6,10}-[a-z0-9]{5}$/
                | parse @message /trace_id\W+(?<trace_id>[0-9a-f]{32})/
                | parse @message /span_id\W+(?<span_id>[0-9a-f]{16})/
                | filter trace_id = "$${traceID}"
                | fields @timestamp, coalesce(pod_service, kubernetes.pod_name) as service, trace_id, span_id, @message
                | sort @timestamp asc
                | limit 500
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      access: proxy
      # Logs -> trace (ADR 0011, PR 4): in Explore, a log line's trace_id field opens the trace in
      # Tempo. CloudWatch has no Loki-style derived fields; a correlation does it, on any Logs
      # Insights query that returns a trace_id field (the parse in RUNBOOK section 12).
      correlations:
        - targetUID: tempo
          label: Open this trace (Tempo)
          description: The trace of this log line
          type: query
          config:
            field: trace_id
            target:
              queryType: traceql
              query: $${trace_id}
      jsonData:
        authType: default          # AWS SDK default chain = EKS Pod Identity
        defaultRegion: us-east-1
  sidecar:
    # Both sidecars (grafana-sc-dashboard, grafana-sc-datasources): one setting in the chart.
    # They had no requests, so the scheduler reserved nothing for them.
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 192Mi }
    datasources:
      defaultDatasourceEnabled: false   # replaced by the Prometheus entry above
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
