# dev, deployed by Argo CD from main: the same chart and values files as the Helm
# deploy, plus gitops/dev/values.yaml (Terraform names + image tag, written by the
# deploy workflow). deploy/argocd.sh fills in the repository URL.
#
# No resources finalizer: deleting this Application leaves the shop running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
spec:
  project: boutique
  source:
    repoURL: ${REPO_URL}
    targetRevision: main
    path: helm-chart
    helm:
      releaseName: boutique
      valueFiles:
        - values-aws.yaml
        - values-dev.yaml
        - ../gitops/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  # Argo Rollouts canary of the frontend (ADR 0008): during a rollout the Rollouts controller
  # sets the traffic weights in the Ingress action annotation and adds the pod-template hash
  # to the stable and canary Service selectors. Those fields are the controller's, so Argo CD
  # neither shows them as drift nor puts them back (RespectIgnoreDifferences below). The
  # frontend Deployment only holds the Rollout's template (workloadRef): the Rollouts
  # controller scales it to 0, and its replicas are not Argo CD's to restore.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: frontend
      jsonPointers:
        - /spec/replicas
    - group: networking.k8s.io
      kind: Ingress
      name: frontend
      jqPathExpressions:
        - '.metadata.annotations["alb.ingress.kubernetes.io/actions.frontend"]'
    - group: ""
      kind: Service
      name: frontend
      jqPathExpressions:
        - '.spec.selector["rollouts-pod-template-hash"]'
    - group: ""
      kind: Service
      name: frontend-canary
      jqPathExpressions:
        - '.spec.selector["rollouts-pod-template-hash"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace, its labels and the Secrets in it belong to the deploy workflow.
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
