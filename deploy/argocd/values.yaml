# argo-cd Helm chart values (installed by deploy/argocd.sh). A small install for one cluster.

configs:
  cm:
    # Argo CD marks what it manages with an annotation, so it only ever prunes objects it
    # created from Git. The Secrets, Job and ConfigMap the deploy workflow creates in
    # boutique-dev (redis-auth, emailservice-slack, db-migrate...) are never touched.
    application.resourceTrackingMethod: annotation
    exec.enabled: false # no shell into pods from the UI
    # HorizontalPodAutoscaler health. Argo CD's built-in check marks an HPA Degraded when
    # ScalingActive=False, which happens for a minute after the pods change (a canary, a
    # promotion: metrics-server has no CPU numbers for the new pods yet). That made
    # boutique-prod Degraded right after a successful canary, and the deploy rolled back.
    # Here: Degraded only for real misconfigurations (no scale target, bad selector or metric
    # source); "no metrics yet" is Progressing, which the deploy waits out (and reports at
    # its timeout if it never clears).
    resource.customizations.health.autoscaling_HorizontalPodAutoscaler: |
      hs = {}
      local broken = { FailedGetScale = true, FailedUpdateScale = true, InvalidSelector = true, InvalidMetricSourceType = true }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.status == "False" and broken[c.reason] then
            hs.status = "Degraded"
            hs.message = c.reason .. ": " .. (c.message or "")
            return hs
          end
        end
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "ScalingActive" and c.status == "False" then
            hs.status = "Progressing"
            hs.message = "No metrics for the current pods yet: " .. (c.message or "")
            return hs
          end
        end
      end
      hs.status = "Healthy"
      hs.message = "Scaling on current metrics"
      return hs
  params:
    # Argo CD 3 no longer keeps each resource's health in the Application status: the deploy
    # wait and the canary report could see "Degraded" but not which resource. Keep it.
    controller.resource.health.persist: "true"
    # TLS ends at the ALB (deploy/argocd/ingress.yaml, ACM certificate); argocd-server
    # speaks plain HTTP inside the VPC, so the ALB health check and requests don't loop
    # through its own redirect to HTTPS.
    server.insecure: true

dex:
  enabled: false # no SSO yet: the local admin user (password from ARGOCD_ADMIN_PASSWORD)

notifications:
  enabled: false

# GKE as a second cluster (ADR 0014, decision 4): the controller (syncs) and the server (UI live
# view, logs) sign in to GCP with their own Kubernetes service account token. No key, no
# static token:
#   - gcp-token: a projected token for the audience eks-argocd, the only one the eks-argocd
#     pool's provider accepts (terraform-gcp-bootstrap/argocd.tf); the kubelet renews it;
#   - gcp-credentials: the credential file pointing Google's client library at that token and at
#     argocd-hub (ConfigMap written by deploy/argocd-gke.sh; nothing secret in it). Optional: the
#     pods start without it, and only the GKE cluster's argocd-k8s-auth gcp needs it.
controller:
  volumes: &gcpVolumes
    - name: gcp-token
      projected:
        sources:
          - serviceAccountToken:
              audience: eks-argocd
              expirationSeconds: 3600
              path: token
    - name: gcp-credentials
      configMap:
        name: gcp-wif-credentials
        optional: true
  volumeMounts: &gcpVolumeMounts
    - name: gcp-token
      mountPath: /var/run/secrets/gcp
      readOnly: true
    - name: gcp-credentials
      mountPath: /etc/gcp
      readOnly: true

server:
  volumes: *gcpVolumes
  volumeMounts: *gcpVolumeMounts
  service:
    type: ClusterIP # never a LoadBalancer: the only public way in is the ALB of the Ingress
  ingress:
    enabled: false # the Ingress is applied by deploy/argocd-ui.sh (address and certificate from Terraform)
