# THROWAWAY CONNECTION PROBE: delete with the rest of the probe (probe-rbac.yaml).
# An Application with nothing to deploy (probe/ holds no manifest), targeting GKE. Argo CD only
# watches a cluster that an Application uses: without one, the cluster stays "Unknown: Cluster
# has no applications and is not being monitored." (Argo CD v3.5.3,
# controller/clusterinfoupdater.go). With it, Argo CD syncs its cache of argocd-probe and
# reports the connection. No sync policy: it never deploys anything.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gke-connection-probe
  namespace: argocd
spec:
  project: gke-probe
  source:
    repoURL: ${REPO_URL}
    targetRevision: main
    path: deploy/argocd/gke/probe
    directory:
      recurse: false
  destination:
    name: boutique-gke
    namespace: argocd-probe
