# THROWAWAY CONNECTION PROBE (ADR 0014, decision 4). Delete this file, probe-project.yaml,
# probe-app.yaml and probe/ once the real GKE Application exists.
#
# Applied to GKE (not EKS) by deploy/argocd-gke.sh, as gha-deploy. An empty namespace that
# argocd-hub may only read: enough for Argo CD to sync its cache of the cluster and report the
# connection, nothing it could change. Cluster-scoped objects: only this Namespace, created
# here, never by Argo CD. ${ARGOCD_SA} is argocd-hub's email (GKE names IAM users by email).
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-probe
  labels:
    app.kubernetes.io/part-of: gke-connection-probe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-read
  namespace: argocd-probe
  labels:
    app.kubernetes.io/part-of: gke-connection-probe
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch] # Argo CD's cache lists every namespaced type it may see
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-hub-read
  namespace: argocd-probe
  labels:
    app.kubernetes.io/part-of: gke-connection-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${ARGOCD_SA}
