name: argocd-install

# Installs or updates Argo CD in the cluster (namespace "argocd") and hands dev over to it:
# Actions > argocd-install > Run workflow, from main. Run it again after the first dev
# deploy from main has written gitops/dev/values.yaml: that run creates the Application
# "boutique-dev", and from then on deploy-env.yml deploys dev through Git. The same for
# prod after its first approved deploy from main has created the promotion branch: the
# next run creates "boutique-prod" (ADR 0007).
# Before the first run: docs/week3/ARGOCD.md (deploy key, GitHub App, terraform apply).
# Optional UI at https://argocd.<domain>: secret ARGOCD_ADMIN_PASSWORD and variable
# ARGOCD_ALLOWED_CIDR (deploy/argocd-ui.sh).

on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

concurrency:
  group: argocd-install
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ARGOCD_CHART_VERSION: 10.9.2 # Argo CD v3.5.3

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy role only trusts main and the dev/prod environments.
    environment: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # argocd-wait.sh compares commits of main

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Connect kubectl to the cluster
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          secret_arn=$(jq -r '.outputs.argocd_repo_key_secret_arn.value // empty' state.json)
          [ -n "$secret_arn" ] || { echo "::error::No argocd_repo_key_secret_arn in the Terraform outputs. Run the infra workflow (apply) first."; exit 1; }
          echo "REPO_KEY_SECRET_ARN=${secret_arn}" >> "$GITHUB_ENV"
          # The UI's HTTPS name, certificate and zone (terraform-aws/dns.tf; empty without a domain).
          {
            echo "ARGOCD_HOST=$(jq -r '.outputs.tls.value.hosts.argocd // (if .outputs.tls.value.domain then "argocd." + .outputs.tls.value.domain else empty end)' state.json)"
            echo "CERT_ARN=$(jq -r '.outputs.tls.value.certificate_arn // empty' state.json)"
            echo "DNS_ZONE_ID=$(jq -r '.outputs.tls.value.zone_id // empty' state.json)"
          } >> "$GITHUB_ENV"
          aws eks update-kubeconfig --name "$(jq -r '.outputs.cluster_name.value' state.json)" --region "$AWS_REGION"
          rm -f state.json

      - name: Install Argo CD and the Applications
        env:
          REPO_URL: git@github.com:${{ github.repository }}.git
          # UI (deploy/argocd-ui.sh). Masked in the script; never echoed.
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
          ARGOCD_ALLOWED_CIDR: ${{ vars.ARGOCD_ALLOWED_CIDR }}
        run: bash deploy/argocd.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Argo CD"
            echo
            echo '```'
            kubectl -n argocd get pods 2>/dev/null || echo "not installed"
            echo
            kubectl -n argocd get applications 2>/dev/null || true
            echo '```'
            echo
            echo "UI: https://${ARGOCD_HOST:-argocd.<domain>} once ARGOCD_ALLOWED_CIDR and ARGOCD_ADMIN_PASSWORD are set (reachable only from that address), see docs/week3/ARGOCD.md."
          } >> "$GITHUB_STEP_SUMMARY"
