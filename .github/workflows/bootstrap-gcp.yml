name: bootstrap-gcp

# Re-runs of terraform-gcp-bootstrap/ (ADR 0014), the GCP twin of the bootstrap workflow:
#   - the APIs and the GCS bucket that holds every GCP Terraform state
#   - Workload Identity Federation for GitHub (this repository only, by numeric ID)
#   - gha-plan (read-only, pull requests), gha-deploy (main and dev/prod), gha-bootstrap (this)
#   - no service account keys (organization policies), the project's monthly budget
#
# The FIRST run is done by the project owner from a laptop (terraform-gcp-bootstrap/README.md):
# the federation this workflow signs in with doesn't exist before it. After that, changes to
# terraform-gcp-bootstrap/ are applied here. It signs in as gha-bootstrap, which only jobs of
# the protected "prod" environment may use, so the prod reviewers approve each run.
#
# Run it first with "apply" unchecked to review the plan, then again with "apply" checked.
# The repository and its logs are public: no plan values and no outputs are printed, only which
# resources change.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the changes (unchecked = plan only)"
        type: boolean
        default: false

permissions:
  id-token: write # GitHub OIDC -> GCP Workload Identity Federation
  contents: read

concurrency:
  group: bootstrap-gcp
  cancel-in-progress: false

env:
  STATE_PREFIX: bootstrap
  TF_IN_AUTOMATION: "true"

jobs:
  bootstrap:
    name: Bootstrap GCP (${{ inputs.apply && 'apply' || 'plan only' }})
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terraform-gcp-bootstrap
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_BOOTSTRAP_SA: ${{ vars.GCP_BOOTSTRAP_SA }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      TF_VAR_monthly_budget_usd: ${{ vars.GCP_MONTHLY_BUDGET_USD }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }} # masked in the logs
      TF_VAR_enforce_no_key_policy: ${{ vars.GCP_ENFORCE_NO_KEY_POLICY || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the GCP variables are configured
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_BOOTSTRAP_SA GCP_TF_STATE_BUCKET TF_VAR_monthly_budget_usd TF_VAR_billing_account_id; do
            [ -n "${!v}" ] || missing="${missing} ${v}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:${missing}. Do the first run by hand, then set them (terraform-gcp-bootstrap/README.md, step 5)."
            exit 1
          fi

      # Who GitHub says this job is: the provider admits only this repository's IDs, and
      # gha-bootstrap only the prod environment. Compare these if the sign-in fails. Only the
      # claims are shown, never the token.
      - name: Show the identity GitHub presents to GCP
        run: |
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${GCP_WIF_PROVIDER}" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(cut -d. -f2 <<<"${token}" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          base64 -d <<<"${payload}" | jq '{sub, repository_id, repository_owner_id, event_name, ref, environment}'

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BOOTSTRAP_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      # The bucket exists since the first run: the state is always there.
      - name: terraform init
        run: |
          cat > ci_backend.tf <<EOF
          terraform {
            backend "gcs" {
              bucket = "${GCP_TF_STATE_BUCKET}"
              prefix = "${STATE_PREFIX}"
            }
          }
          EOF
          terraform init -input=false -no-color > /dev/null
          echo "terraform init done (state: gs://<bucket>/${STATE_PREFIX})"

      # The trust and the rights, checked with a mocked provider before anything is planned.
      - name: terraform test (trust, rights, no keys)
        run: |
          terraform test -no-color
          # GitHub may sign in only through federation.tf's bindings (plan, deploy, bootstrap):
          # never as the GKE node service account or any account added in another file.
          if grep -l 'roles/iam.workloadIdentityUser' ./*.tf | grep -vx './federation.tf'; then
            echo "::error::roles/iam.workloadIdentityUser outside federation.tf: GitHub must not sign in as that account"
            exit 1
          fi

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var "project_id=${GCP_PROJECT_ID}" \
            -var "github_repo_id=${{ github.repository_id }}" \
            -var "github_owner_id=${{ github.repository_owner_id }}" > plan.log 2>&1 \
            || { grep -E "^(Error|│ Error)" -A6 plan.log | head -40; exit 1; }
          changes=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.change.actions | join("+"))\t\(.address)"')
          {
            echo "### GCP bootstrap plan"
            echo
            grep -E '^Plan:|^No changes' plan.log || true
            echo
            echo '```'
            echo "${changes:-no resource changes}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f plan.log

      - name: terraform apply
        if: inputs.apply
        run: |
          # Only the result is printed: apply lines carry resource IDs (project, service accounts).
          rc=0; terraform apply -input=false -no-color tfplan > apply.log 2>&1 || rc=$?
          grep -E '^Apply complete' apply.log || grep -E '^(Error|│ Error)' -A6 apply.log | head -40
          rm -f apply.log
          exit "$rc"

      # No user-managed key may exist on the CI service accounts (Google-managed keys, used for
      # impersonation, are fine). This is the check that still holds when the project has no
      # organization for the key policies.
      - uses: google-github-actions/setup-gcloud@v3

      - name: No service account keys
        run: |
          found=0
          for sa in $(terraform output -json | jq -r '.GCP_PLAN_SA.value, .GCP_DEPLOY_SA.value, .GCP_BOOTSTRAP_SA.value'); do
            n=$(gcloud iam service-accounts keys list --iam-account "$sa" --managed-by=user --format='value(name)' 2>/dev/null | wc -l)
            echo "${sa%%@*}: ${n} user-managed keys"
            [ "$n" -eq 0 ] || found=1
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::A service account key exists. Delete it (gcloud iam service-accounts keys delete) and find out who created it (Cloud Audit Logs)."
            exit 1
          fi
