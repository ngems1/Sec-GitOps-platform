name: cluster-status

# Look inside the cluster without kubectl on your laptop or CloudShell:
# Actions > cluster-status > Run workflow. Read-only (get, describe, logs).
# Results are in the log and on the run's Summary page.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to inspect"
        type: choice
        options: [boutique-dev, boutique-prod, monitoring, kube-system, amazon-cloudwatch]
        default: boutique-dev

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          aws eks update-kubeconfig --name "$(jq -r '.outputs.cluster_name.value' state.json)" --region "$AWS_REGION"
          rm -f state.json

      - name: Nodes
        run: |
          kubectl get nodes -o wide
          # Pod limit per node (17 without VPC CNI prefix delegation, 110 with it) and pods running.
          kubectl get nodes -o custom-columns='NODE:.metadata.name,MAX_PODS:.status.allocatable.pods'
          kubectl get pods -A --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort | uniq -c | sed 's/^/  pods running on /'
          kubectl top nodes 2>/dev/null || true

      - name: Helm releases
        run: helm list -A 2>/dev/null || true

      # Deployment history of the shop in this namespace: every deploy and rollback is a
      # new revision, with the image tag (commit SHA) it runs. Evidence for the rollback demo.
      - name: Helm history
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          helm -n "$NS" history boutique --max 8 2>/dev/null || true
          echo
          echo "Image running now:"
          kubectl -n "$NS" get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' 2>/dev/null || true

      # Read-only (get, describe). PriorityClasses come from deploy-env.yml (ADR 0006); quota,
      # limits and disruption budgets from the chart. Missing objects are reported, not errors.
      - name: Guardrails
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### Guardrails in ${NS}"
            echo '```'
            echo "\$ kubectl get priorityclass boutique-dev boutique-prod"
            kubectl get priorityclass boutique-dev boutique-prod 2>&1 || true
            echo
            echo "\$ kubectl -n ${NS} get resourcequota,limitrange,pdb"
            kubectl -n "$NS" get resourcequota,limitrange,pdb 2>&1 || true
            echo
            echo "\$ kubectl -n ${NS} describe resourcequota"
            kubectl -n "$NS" describe resourcequota 2>&1 || true
            if [ -n "$(kubectl get crd applications.argoproj.io --ignore-not-found -o name 2>/dev/null)" ]; then
              echo
              echo "\$ Argo CD Application boutique-dev (sync, health, revision)"
              kubectl -n argocd get application boutique-dev --ignore-not-found \
                -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}{"\n"}' 2>&1 || true
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Namespace snapshot
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### ${NS}"
            echo '```'
            bash deploy/diagnose.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
