name: cluster-status

# Look inside the cluster without kubectl on your laptop or CloudShell:
# Actions > cluster-status > Run workflow. Read-only (get, describe, logs).
# Results are in the log and on the run's Summary page.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to inspect"
        type: choice
        options: [boutique-dev, boutique-prod, monitoring, kube-system, amazon-cloudwatch]
        default: boutique-dev

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # OpenAPI health: up to 80 requests of at most 10 s
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          aws eks update-kubeconfig --name "$(jq -r '.outputs.cluster_name.value' state.json)" --region "$AWS_REGION"
          rm -f state.json

      - name: Nodes
        run: |
          kubectl get nodes -o wide
          # Pod limit per node (17 without VPC CNI prefix delegation, 110 with it) and pods running.
          kubectl get nodes -o custom-columns='NODE:.metadata.name,MAX_PODS:.status.allocatable.pods'
          kubectl get pods -A --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort | uniq -c | sed 's/^/  pods running on /'
          kubectl top nodes 2>/dev/null || true

      # Read-only (describe). What the scheduler counts: requests (and limits) against each
      # node's allocatable CPU and memory, per node and in total. Measures the capacity
      # estimates of ADR 0010 (section "Capacity") before and after a change.
      - name: Node capacity
        run: |
          {
            echo "### Node capacity (requests, what the scheduler counts)"
            echo '```'
            kubectl describe nodes | awk '
              function cpu(v) { return v ~ /m$/ ? substr(v, 1, length(v) - 1) + 0 : v * 1000 }
              function mib(v) {
                if (v ~ /Ki$/) return substr(v, 1, length(v) - 2) / 1024
                if (v ~ /Mi$/) return substr(v, 1, length(v) - 2) + 0
                if (v ~ /Gi$/) return substr(v, 1, length(v) - 2) * 1024
                if (v ~ /k$/)  return substr(v, 1, length(v) - 1) * 1000 / 1048576
                if (v ~ /M$/)  return substr(v, 1, length(v) - 1) * 1000000 / 1048576
                if (v ~ /G$/)  return substr(v, 1, length(v) - 1) * 1000000000 / 1048576
                return v / 1048576
              }
              function row() {
                if (node == "") return
                printf "%-46s %6dm %6dm %3d%% %6dm | %6dMi %6dMi %3d%% %6dMi\n", node, acpu, rcpu, (acpu ? 100 * rcpu / acpu : 0), lcpu, amem, rmem, (amem ? 100 * rmem / amem : 0), lmem
                tacpu += acpu; trcpu += rcpu; tlcpu += lcpu; tamem += amem; trmem += rmem; tlmem += lmem
              }
              BEGIN { printf "%-46s %7s %7s %4s %7s | %8s %8s %4s %8s\n", "NODE", "CPU", "REQ", "%", "LIMITS", "MEMORY", "REQ", "%", "LIMITS" }
              /^Name:/ { row(); node = $2; sec = ""; acpu = rcpu = lcpu = amem = rmem = lmem = 0 }
              /^Allocatable:/ { sec = "alloc"; next }
              /^Allocated resources:/ { sec = "used"; next }
              /^[A-Z]/ { if ($0 !~ /^(Allocatable|Allocated)/) sec = "" }
              sec == "alloc" && $1 == "cpu:" { acpu = cpu($2) }
              sec == "alloc" && $1 == "memory:" { amem = mib($2) }
              sec == "used" && $1 == "cpu" { rcpu = cpu($2); lcpu = cpu($4) }
              sec == "used" && $1 == "memory" { rmem = mib($2); lmem = mib($4) }
              END {
                row()
                printf "%-46s %6dm %6dm %3d%% %6dm | %6dMi %6dMi %3d%% %6dMi\n", "TOTAL", tacpu, trcpu, (tacpu ? 100 * trcpu / tacpu : 0), tlcpu, tamem, trmem, (tamem ? 100 * trmem / tamem : 0), tlmem
                printf "Headroom (allocatable - requests): CPU %dm, memory %dMi\n", tacpu - trcpu, tamem - trmem
              }'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (get, top). The tracing backend in "monitoring" (ADR 0010): the OTel Collector
      # and Tempo pods, their restarts and usage, and their chart versions.
      - name: Tracing backend
        run: |
          {
            echo "### Tracing backend (monitoring)"
            echo '```'
            sel='app.kubernetes.io/instance in (otel-collector,tempo)'
            echo "\$ kubectl -n monitoring get pods -l '${sel}' -o wide"
            kubectl -n monitoring get pods -l "$sel" -o wide 2>&1 || true
            echo
            kubectl -n monitoring get pods -l "$sel" \
              -o custom-columns='POD:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,LAST_TERMINATION:.status.containerStatuses[0].lastState.terminated.reason' 2>&1 || true
            echo
            kubectl -n monitoring top pods -l "$sel" 2>/dev/null || echo "(kubectl top: metrics-server not answering)"
            echo
            helm -n monitoring list -f '^(otel-collector|tempo)$' 2>/dev/null || true
            echo
            kubectl -n monitoring get networkpolicy otel-collector tempo 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Real CPU and memory use per container over the last 24 h (Prometheus), against requests and
      # limits, with a suggested request: data for right-sizing, nothing is changed. A one-off Job
      # in "monitoring" queries Prometheus (no secret) and is removed afterwards
      # (deploy/resource-usage.sh; RUNBOOK section 13).
      - name: Resource usage
        continue-on-error: true # the other sections still run without Prometheus
        env:
          CURL_IMAGE: docker.io/curlimages/curl:8.22.0
        run: |
          {
            echo "### Resource usage (last 24 h; CPU in millicores, memory in MiB)"
            echo '```'
            bash deploy/resource-usage.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (list-addons, describe-addon). The EKS add-ons and the exact versions they
      # run, for pinning them in terraform-aws/eks.tf (addon_version, never most_recent:
      # RUNBOOK "Upgrade an EKS add-on"). Add-ons running but not in eks.tf are flagged.
      - name: EKS add-ons
        run: |
          cluster=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')
          cluster="${cluster##*/}"
          managed=$(sed -n '/cluster_addons = {/,/^  }$/p' terraform-aws/eks.tf | sed -n 's/^    \([a-z0-9-]*\) = {$/\1/p')
          {
            echo "### EKS add-ons (${cluster})"
            echo '```'
            printf '%-34s %-28s %-9s %s\n' NAME VERSION STATUS "IN eks.tf"
            snippet=""
            for addon in $(aws eks list-addons --cluster-name "$cluster" --region "$AWS_REGION" --query 'addons[]' --output text); do
              read -r name version status < <(aws eks describe-addon --cluster-name "$cluster" --addon-name "$addon" --region "$AWS_REGION" \
                --query 'addon.[addonName,addonVersion,status]' --output text)
              if grep -qx "$name" <<<"$managed"; then in_tf=yes; else in_tf="NO (not managed by Terraform)"; fi
              printf '%-34s %-28s %-9s %s\n' "$name" "$version" "$status" "$in_tf"
              snippet+="    ${name}: addon_version = \"${version}\""$'\n'
            done
            echo
            echo "For terraform-aws/eks.tf (with most_recent = false):"
            printf '%s' "$snippet"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Helm releases
        run: helm list -A 2>/dev/null || true

      # Deployment history of the shop in this namespace: every deploy and rollback is a
      # new revision, with the image tag (commit SHA) it runs. Evidence for the rollback demo.
      - name: Helm history
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          helm -n "$NS" history boutique --max 8 2>/dev/null || true
          echo
          echo "Image running now:"
          kubectl -n "$NS" get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' 2>/dev/null || true

      # Read-only (get, describe). PriorityClasses come from deploy-env.yml (ADR 0006); quota,
      # limits and disruption budgets from the chart. Missing objects are reported, not errors.
      - name: Guardrails
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### Guardrails in ${NS}"
            echo '```'
            echo "\$ kubectl get priorityclass boutique-dev boutique-prod"
            kubectl get priorityclass boutique-dev boutique-prod 2>&1 || true
            echo
            echo "\$ kubectl -n ${NS} get resourcequota,limitrange,pdb"
            kubectl -n "$NS" get resourcequota,limitrange,pdb 2>&1 || true
            echo
            echo "\$ kubectl -n ${NS} describe resourcequota"
            kubectl -n "$NS" describe resourcequota 2>&1 || true
            if [ -n "$(kubectl get crd applications.argoproj.io --ignore-not-found -o name 2>/dev/null)" ]; then
              echo
              echo "\$ Argo CD Application boutique-dev (sync, health, revision)"
              kubectl -n argocd get application boutique-dev --ignore-not-found \
                -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}{"\n"}' 2>&1 || true
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (get, logs). The frontend canary (Argo Rollouts, ADR 0008): Rollout status
      # and abort message, AnalysisRuns with their measured values, which pods are canary or
      # stable, Rollout events, and the loadgenerator that feeds the canary its traffic.
      - name: Rollouts
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### Rollouts in ${NS}"
            echo '```'
            bash deploy/rollouts-report.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (get). Kyverno's audit of image signatures and SBOM attestations (ADR 0013):
      # PolicyReport results per pod, and every result that is not "pass" (RUNBOOK section 16).
      - name: Image signatures (Kyverno, audit)
        if: startsWith(inputs.namespace, 'boutique-')
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### Image signatures (Kyverno audit) in ${NS}"
            echo '```'
            bash deploy/kyverno-report.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (get). An aggregated API that is down makes kubectl's discovery fail with
      # "the server is currently unable to handle the request" (seen in deploy-env's Load
      # Balancer Controller step). Lists every APIService, then the conditions of each one
      # that is not Available=True.
      - name: API services
        if: inputs.namespace == 'kube-system'
        run: |
          {
            echo "### API services"
            echo '```'
            echo "\$ kubectl get apiservice"
            kubectl get apiservice 2>&1 || true
            echo
            # stderr kept apart: discovery warnings from a down API must not be read as names.
            if ! list=$(kubectl get apiservice -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Available")].status}{"\n"}{end}' 2>apiservice.err); then
              echo "Could not list the APIServices:"
              cat apiservice.err
            else
              # No Available condition at all counts as not available.
              down=$(awk '$2 != "True" { print $1 }' <<<"$list")
              if [ -z "$down" ]; then
                echo "Every APIService is Available=True."
              fi
              for name in $down; do
                echo "\$ kubectl get apiservice ${name} -o jsonpath=<conditions>"
                conditions=$(kubectl get apiservice "$name" \
                  -o jsonpath='{range .status.conditions[*]}{.type}={.status}  reason: {.reason}  message: {.message}{"\n"}{end}' 2>apiservice.err || true)
                if [ -n "$conditions" ]; then echo "$conditions"; else echo "(no status conditions)"; cat apiservice.err; fi
                echo
              done
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only (describe, get --raw, get). Argo CD ("failed to load open api schema") and
      # Helm's validation in deploy-env's LBC step both got "the server is currently unable
      # to handle the request" from the OpenAPI endpoints while every APIService is
      # Available. Suspect: the EKS-managed v1.metrics.eks.amazonaws.com breaks the
      # aggregated OpenAPI, maybe on only some API server instances, hence repeated tries.
      # https://github.com/kubernetes-sigs/aws-load-balancer-controller/issues/4543
      - name: OpenAPI health
        if: inputs.namespace == 'kube-system'
        run: |
          {
            echo "### OpenAPI health"
            echo '```'
            # Cluster name from the kubeconfig context (its ARN ends in cluster/<name>).
            arn=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')
            echo "\$ aws eks describe-cluster --query 'cluster.{version:version,platformVersion:platformVersion}'"
            aws eks describe-cluster --name "${arn##*/}" --region "$AWS_REGION" \
              --query 'cluster.{version:version,platformVersion:platformVersion}' --output json 2>&1 || true
            echo

            paths=(/openapi/v2 /openapi/v3 /openapi/v3/apis/metrics.eks.amazonaws.com/v1 /openapi/v3/apis/apps/v1)
            declare -A ok fail first
            for p in "${paths[@]}"; do ok[$p]=0; fail[$p]=0; first[$p]=""; done
            # 20 rounds, 2 s apart; each round tries every path, so they see the same moments.
            for i in $(seq 1 20); do
              for p in "${paths[@]}"; do
                if err=$(kubectl get --raw "$p" --request-timeout=10s 2>&1 >/dev/null); then
                  ok[$p]=$(( ok[$p] + 1 ))
                else
                  fail[$p]=$(( fail[$p] + 1 ))
                  [ -n "${first[$p]}" ] || first[$p]="attempt ${i}: $(head -c 400 <<<"$err" | tr '\n' ' ')"
                fi
              done
              [ "$i" = 20 ] || sleep 2
            done
            echo "kubectl get --raw <path> --request-timeout=10s (20 tries each, 2 s apart; apps/v1 is the control)"
            for p in "${paths[@]}"; do
              printf '%-46s OK %2d  failed %2d\n' "$p" "${ok[$p]}" "${fail[$p]}"
            done
            for p in "${paths[@]}"; do
              [ -z "${first[$p]}" ] || echo "first failure of ${p}: ${first[$p]}"
            done
            echo

            # managedFields are left out (kubectl's default; explicit here). An APIService
            # holds no Secret: its caBundle is the serving CA's public certificate.
            echo "\$ kubectl get apiservice v1.metrics.eks.amazonaws.com -o yaml"
            kubectl get apiservice v1.metrics.eks.amazonaws.com -o yaml --show-managed-fields=false 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Namespace snapshot
        env:
          NS: ${{ inputs.namespace }}
        run: |
          {
            echo "### ${NS}"
            echo '```'
            bash deploy/diagnose.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
