name: ci

# Pull-request checks (GitHub Flow). Nothing here touches AWS: it only proves the
# change is safe to merge. Merging to main then deploys (deploy.yml) and applies
# Terraform (infra.yml, whose plan also runs on the pull request).
#
# The branch rule on main requires the single check "ci-ok", which passes only
# when every job below passed or was skipped because nothing it covers changed.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push to the branch replaces the running checks

jobs:
  # Which services changed? Only those images are built.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD | awk -F/ '$1=="src" && NF>2 {print $2}' | sort -u)
          json=$(printf '%s\n' $changed | jq -R . | jq -sc '
            map(select(length > 0))
            | map({service: ., context: (if . == "cartservice" then "src/cartservice/src" else "src/\(.)" end)})')
          echo "services=${json}" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$json" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Changed services: ${json}"

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # With its pinned requirements: test_tracing.py needs OpenTelemetry and boto3 (Python 3.12, the image's).
      - name: inventoryservice
        working-directory: src/inventoryservice
        run: |
          python -m venv "$RUNNER_TEMP/venv-inventory"
          "$RUNNER_TEMP/venv-inventory/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/venv-inventory/bin/python" -m unittest -v
      # The Java agent switch (ENABLE_TRACING=1 only), tested on the entrypoint script.
      - name: adservice entrypoint (tracing switch)
        run: bash src/adservice/test-entrypoint.sh
      # The JSON log layout: trace_id / span_id / trace_flags from the Java agent (ADR 0011).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # same as the Dockerfile
          cache: gradle
          cache-dependency-path: src/adservice/build.gradle
      - name: adservice log layout (gradle test)
        working-directory: src/adservice
        run: bash gradlew --no-daemon test # gradlew is not executable in git (the Dockerfile chmods it)
      # End to end: the built adservice with the Java agent and the image's own environment (the
      # Dockerfile's ENV and entrypoint) logs trace_id / span_id / trace_flags with tracing on and
      # none with tracing off. The agent version and SHA-256 come from the Dockerfile.
      - name: adservice log trace IDs (agent, image environment)
        working-directory: src/adservice
        run: |
          bash gradlew --no-daemon -q installDist
          version=$(sed -n 's/^ARG OTEL_JAVAAGENT_VERSION=//p' Dockerfile)
          sha=$(sed -n 's/^ARG OTEL_JAVAAGENT_SHA256=//p' Dockerfile)
          curl -sSfLo "$RUNNER_TEMP/opentelemetry-javaagent.jar" \
            "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v${version}/opentelemetry-javaagent.jar"
          echo "${sha}  $RUNNER_TEMP/opentelemetry-javaagent.jar" | sha256sum -c -
          bash test-log-trace-ids.sh build/install/hipstershop "$RUNNER_TEMP/opentelemetry-javaagent.jar"
      - name: emailservice (notification consumer)
        working-directory: src/emailservice
        run: python -m unittest -v test_notifications
      # No personal data in log calls (ADR 0011). The fixture proves the guard still catches the
      # patterns it is meant for.
      - name: no personal data in logs (grep guard)
        run: |
          bash deploy/tests/no-pii-in-logs.sh
          if bash deploy/tests/no-pii-in-logs.sh deploy/tests/no-pii-in-logs > "$RUNNER_TEMP/pii.txt"; then
            echo "::error::the guard missed the known-bad lines in deploy/tests/no-pii-in-logs"; exit 1
          fi
          test "$(grep -c '^deploy/tests/no-pii-in-logs/' "$RUNNER_TEMP/pii.txt")" -eq 12
      # CloudWatch SEARCH terms are token matches: a quoted term must equal a whole dimension value
      # (RUNBOOK section 5). The fixtures prove the check still catches what it is meant for.
      - name: CloudWatch SEARCH terms (dashboard, diagnose.sh)
        run: |
          bash deploy/tests/cloudwatch-search-check.sh
          if bash deploy/tests/cloudwatch-search-check.sh deploy/tests/cloudwatch-search/bad.json deploy/tests/cloudwatch-search/bad.sh > "$RUNNER_TEMP/cw.txt"; then
            echo "::error::the check missed the known-bad SEARCH terms in deploy/tests/cloudwatch-search"; exit 1
          fi
          test "$(grep -c '^::error' "$RUNNER_TEMP/cw.txt")" -eq 3
      # Every PromQL query of the dashboards parses, with the cluster's Prometheus version
      # (kube-prometheus-stack 89.2.4 runs v3.14.0). Unquoted label values broke Order success and
      # Pods not ready after #61. Tempo Service Graph selectors (serviceMapQuery) are checked too.
      # The fixture has two broken queries (one a Service Graph selector) and one with Grafana
      # variables.
      - name: Dashboard PromQL parses (promtool)
        env:
          PROMETHEUS_VERSION: "3.14.0"
        run: |
          d="$RUNNER_TEMP/prometheus"; mkdir -p "$d"; cd "$d"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/sha256sums.txt"
          grep " ${tarball}\$" sha256sums.txt | sha256sum -c -
          tar -xzf "$tarball" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          cd "$GITHUB_WORKSPACE"
          export PROMTOOL="$d/promtool"
          bash deploy/tests/promql-check.sh
          if bash deploy/tests/promql-check.sh deploy/tests/promql/bad.json > "$RUNNER_TEMP/pq.txt" 2>&1; then
            echo "::error::the PromQL check missed the broken query in deploy/tests/promql/bad.json"; exit 1
          fi
          test "$(grep -c 'could not parse expression' "$RUNNER_TEMP/pq.txt")" -eq 2
      # Trace <-> logs in Grafana (ADR 0011, PR 4): the provisioned Tempo and CloudWatch data sources
      # keep their correlations (variables escaped as $${...}) and the "logs and traces" dashboard
      # its links. Service Graph (PR 7): Tempo's serviceMap and nodeGraph, the Boutique dashboard's
      # Service graph panel and exemplars on its span latency panel. The fixtures lose or break
      # them and must give 6 errors.
      - name: Grafana trace <-> logs links
        run: |
          bash deploy/tests/grafana-links-check.sh
          if bash deploy/tests/grafana-links-check.sh deploy/tests/grafana-links/bad-values.yaml \
               monitoring/dashboards/logs-traces.json deploy/tests/grafana-links/bad-boutique.json > "$RUNNER_TEMP/gl.txt"; then
            echo "::error::the check missed the broken links in deploy/tests/grafana-links"; exit 1
          fi
          test "$(grep -c '^::error' "$RUNNER_TEMP/gl.txt")" -eq 6
      # The collector's span metrics and service graph see ALL spans (ADR 0011, PR 5): connectors
      # in traces/in, tail sampling only after them, sampling policies unchanged, low-cardinality
      # dimensions, gRPC and HTTP health checks filtered before the connectors. The fixture breaks six of
      # these and must give 6 errors.
      - name: Collector pipelines (connectors before tail sampling)
        run: |
          bash deploy/tests/collector-pipelines-check.sh
          if bash deploy/tests/collector-pipelines-check.sh deploy/tests/collector-pipelines/bad-values.yaml > "$RUNNER_TEMP/cp.txt"; then
            echo "::error::the check missed the broken pipelines in deploy/tests/collector-pipelines/bad-values.yaml"; exit 1
          fi
          test "$(grep -c '^::error' "$RUNNER_TEMP/cp.txt")" -eq 6
      # Latency point -> example trace (ADR 0011, PR 6): the collector's exemplars in OpenMetrics,
      # Prometheus exemplar-storage with a small buffer, OpenMetrics still asked for first, and
      # Grafana's Prometheus data source linking trace_id to Tempo. The fixtures must give 6 errors.
      - name: Exemplars (Prometheus and Grafana)
        run: |
          bash deploy/tests/exemplars-check.sh
          if bash deploy/tests/exemplars-check.sh deploy/tests/exemplars/bad-kps.yaml deploy/tests/exemplars/bad-collector.yaml > "$RUNNER_TEMP/ex.txt"; then
            echo "::error::the check missed the broken settings in deploy/tests/exemplars"; exit 1
          fi
          test "$(grep -c '^::error' "$RUNNER_TEMP/ex.txt")" -eq 6
      # Kyverno (ADR 0013): audit only and fail open, never mutating, on boutique-dev and
      # boutique-prod; it checks the signing identity, issuer and SBOM type of deploy.yml, on our
      # ECR images only. The fixture breaks six of these and must give 6 errors.
      - name: Kyverno policy (audit only, signing identity)
        run: |
          bash -n deploy/kyverno.sh deploy/kyverno-report.sh
          bash deploy/tests/kyverno-check.sh
          if bash deploy/tests/kyverno-check.sh deploy/tests/kyverno/bad-policy.yaml > "$RUNNER_TEMP/kv.txt"; then
            echo "::error::the check missed the broken policy in deploy/tests/kyverno/bad-policy.yaml"; exit 1
          fi
          test "$(grep -c '^::error' "$RUNNER_TEMP/kv.txt")" -eq 6
      # cluster-status "Resource usage" (deploy/resource-usage.sh): the report math on fixtures.
      - name: resource usage report (fixtures)
        run: |
          bash -n deploy/resource-usage.sh
          bash deploy/resource-usage/test.sh
      - name: order-status Lambda
        working-directory: terraform-aws/lambda/order_status
        run: |
          pip install --quiet pymysql==1.1.1
          python -m unittest -v
      # Same Python as the image, with the pinned runtime installed: the generated gRPC code
      # (demo_pb2*.py) must load with protobuf and grpcio from requirements.txt.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: shoppingassistantservice (fake Bedrock and catalog, pinned runtime)
        working-directory: src/shoppingassistantservice
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest -v
      # Tracing (tracing.py, ADR 0010) with each service's pinned OpenTelemetry and gRPC, one venv
      # per service. google-cloud-profiler is left out: it compiles C++ and the tests don't use it.
      - name: recommendationservice + emailservice (tracing)
        run: |
          for s in recommendationservice emailservice; do
            python -m venv "$RUNNER_TEMP/venv-$s"
            grep -v '^google-cloud-profiler' "src/$s/requirements.txt" > "$RUNNER_TEMP/req-$s.txt"
            "$RUNNER_TEMP/venv-$s/bin/pip" install --quiet -r "$RUNNER_TEMP/req-$s.txt"
            (cd "src/$s" && "$RUNNER_TEMP/venv-$s/bin/python" -m unittest -v test_tracing test_logtrace)
          done
          # emailservice's message spans (messagetrace.py, ADR 0010 step 5) and its gRPC log line
          # (no address, ADR 0011)
          (cd src/emailservice && "$RUNNER_TEMP/venv-emailservice/bin/python" -m unittest -v test_messagetrace test_logs)

  # The Go and C# unit tests (they existed but never ran in CI).
  go-tests:
    name: go tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [checkoutservice, frontend, productcatalogservice, shippingservice]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26" # same toolchain as the Dockerfiles
          cache: true # module + build cache, keyed on go.sum
          cache-dependency-path: src/${{ matrix.service }}/go.sum
      # proxy.golang.org sometimes drops the stream (INTERNAL_ERROR): try 3 times,
      # 10 s then 20 s apart. On a cache hit this finds everything already there.
      - name: go mod download
        working-directory: src/${{ matrix.service }}
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            [ "$attempt" = 3 ] && break
            echo "::warning::go mod download failed (attempt ${attempt}/3), retrying in $((attempt * 10)) s"
            sleep $((attempt * 10))
          done
          echo "::error::go mod download failed 3 times"
          exit 1
      - name: go vet + go test
        working-directory: src/${{ matrix.service }}
        run: |
          go vet ./...
          go test -race -count=1 ./...

  # The Node services' tracing tests (tracing.test.js, node --test; ADR 0010).
  node-tests:
    name: node tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [currencyservice, paymentservice]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24" # same as the Dockerfiles
      - name: npm ci + npm test
        working-directory: src/${{ matrix.service }}
        run: |
          npm ci --no-audit --no-fund
          npm test

  dotnet-tests:
    name: cartservice tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: dotnet test
        run: dotnet test src/cartservice/tests --configuration Release

  # Secret scanning. Fails the pull request if a commit in it adds a
  # credential (AWS keys, Slack webhooks, tokens). No AWS access in this job.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Lint
        run: helm lint ./helm-chart -f helm-chart/values-local.yaml
      # Renders exactly what deploy.yml installs, with placeholder AWS names,
      # so a template mistake fails here and not during a deployment.
      # Each environment also reads gitops/<env>/values.yaml, the file Argo CD deploys it from.
      - name: Render dev and prod
        run: |
          for env in dev prod; do
            gitops=(-f "gitops/${env}/values.yaml")
            # The release, rendered with placeholder AWS names (also used for the PriorityClass below).
            chart=(boutique ./helm-chart --namespace "boutique-${env}"
              -f helm-chart/values-aws.yaml -f "helm-chart/values-${env}.yaml" "${gitops[@]}" \
              --set images.repository=123456789012.dkr.ecr.us-east-1.amazonaws.com/boutique \
              --set images.tag=ci \
              --set frontend.ingress.certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/ci \
              --set cartDatabase.connectionString=redis.example:6379 \
              --set inventoryService.tableName=week3-boutique-${env}-inventory \
              --set inventoryService.queueUrl=https://sqs.us-east-1.amazonaws.com/123456789012/q \
              --set inventoryService.eventBusName=week3-boutique-${env}-events \
              --set checkoutService.orders.eventBusName=week3-boutique-${env}-events \
              --set checkoutService.orders.dbHost=mysql.example \
              --set checkoutService.orders.dbName=boutique \
              --set checkoutService.orders.dbSecretArn=arn:aws:secretsmanager:us-east-1:123456789012:secret:db \
              --set emailService.notifications.queueUrl=https://sqs.us-east-1.amazonaws.com/123456789012/n \
              --set productCatalogService.catalog.dbHost=mysql.example \
              --set productCatalogService.catalog.dbName=boutique \
              --set productCatalogService.catalog.dbSecretArn=arn:aws:secretsmanager:us-east-1:123456789012:secret:db \
              --set productCatalogService.catalog.redisAddr=redis.example:6379 \
              --set emailService.notifications.tableName=week3-boutique-${env}-notifications)
            helm template "${chart[@]}" > "rendered-${env}.yaml"
            echo "${env}: $(grep -c '^kind:' "rendered-${env}.yaml") objects"
            grep '^kind:' "rendered-${env}.yaml" | sort | uniq -c
            # Autoscaling is on for EKS: the HPAs must be in the rendered chart.
            grep -q '^kind: HorizontalPodAutoscaler' "rendered-${env}.yaml" \
              || { echo "::error::${env}: no HorizontalPodAutoscaler rendered"; exit 1; }
            # Guardrails are on for EKS: quota, limits and disruption budgets.
            for kind in ResourceQuota LimitRange PodDisruptionBudget; do
              grep -q "^kind: ${kind}$" "rendered-${env}.yaml" \
                || { echo "::error::${env}: no ${kind} rendered"; exit 1; }
            done
            # The PriorityClass is cluster-scoped: the Argo CD project refuses it, so the
            # release must not contain it. deploy-env.yml renders and applies it alone.
            if grep -q '^kind: PriorityClass$' "rendered-${env}.yaml"; then
              echo "::error::${env}: the release renders a PriorityClass (deploy-env.yml owns it)"; exit 1
            fi
            grep -q "priorityClassName: boutique-${env}" "rendered-${env}.yaml" \
              || { echo "::error::${env}: pods do not use the boutique-${env} PriorityClass"; exit 1; }
            # Frontend canary (ADR 0008): the Rollout, its analysis and canary Service, the
            # Ingress backend on the Rollouts-managed action, and the HPA on the Rollout.
            for kind in Rollout AnalysisTemplate; do
              grep -q "^kind: ${kind}$" "rendered-${env}.yaml" \
                || { echo "::error::${env}: no ${kind} rendered"; exit 1; }
            done
            for want in "name: frontend-canary" "name: use-annotation" "alb.ingress.kubernetes.io/actions.frontend:" "kind: Rollout" "scaleDown: progressively"; do
              grep -q "$want" "rendered-${env}.yaml" \
                || { echo "::error::${env}: frontend canary: '${want}' not rendered"; exit 1; }
            done
            if grep -q "pause: {}" "rendered-${env}.yaml"; then
              echo "::error::${env}: a canary pause without a duration would hang the deploy"; exit 1
            fi
            # As the PriorityClass step in deploy-env.yml does it.
            helm template "${chart[@]}" --set guardrails.priority.render=true \
              --show-only templates/priorityclass.yaml > "priorityclass-${env}.yaml"
            grep -q "^  name: boutique-${env}$" "priorityclass-${env}.yaml" \
              || { echo "::error::${env}: no boutique-${env} PriorityClass for deploy-env.yml"; exit 1; }
          done

      # AI shopping assistant (ADR 0009), on in dev and prod. In each environment it must call
      # exactly the model its Pod Identity role allows (terraform-aws/variables.tf), or every
      # question is denied, and keep its cost guards: one pod (the daily cap is per pod), the
      # token, timeout and rate limits, and a daily cap. The caps of dev and prod together stay at
      # 400 questions a day or less: at the worst case of about USD 0.0012 per question that is
      # USD 0.49, under the 50% alert of the USD 1/day Bedrock budget (math: values-prod.yaml).
      - name: Shopping assistant (model matches Terraform, cost guards)
        run: |
          tf_default() {
            awk -v v="variable \"$1\"" 'index($0, v) == 1 {f = 1} f && $1 == "default" {gsub(/[" ]/, ""); sub(/^default=/, ""); print; exit}' terraform-aws/variables.tf
          }
          deployed() { # env, variable -> the value rendered into the assistant's Deployment
            yq ea -N "select(.kind == \"Deployment\" and .metadata.name == \"shoppingassistantservice\")
              | .spec.template.spec.containers[0].env[] | select(.name == \"$2\") | .value" "rendered-$1.yaml"
          }
          tf_model=$(tf_default shopping_assistant_model_id)
          tf_profile=$(tf_default shopping_assistant_use_inference_profile)
          [ -n "$tf_model" ] && [ -n "$tf_profile" ] \
            || { echo "::error::shopping_assistant_* defaults not found in terraform-aws/variables.tf"; exit 1; }
          # The Terraform defaults are the values applied: nothing may override them.
          if grep -rnE "TF_VAR_shopping_assistant_|shopping_assistant_(model_id|use_inference_profile) *=" .github terraform-aws --include=*.yml --include=*.tfvars --exclude=ci.yml; then
            echo "::error::the shopping_assistant_* Terraform variables are overridden: update this check and helm-chart/values.yaml together"; exit 1
          fi
          total_cap=0
          for env in dev prod; do
            r="rendered-${env}.yaml"
            for pair in "BEDROCK_MODEL_ID=${tf_model}" "BEDROCK_USE_INFERENCE_PROFILE=${tf_profile}"; do
              got=$(deployed "$env" "${pair%%=*}")
              [ "$got" = "${pair#*=}" ] \
                || { echo "::error::${env} ${pair%%=*} is '${got}', Terraform allows '${pair#*=}' (helm-chart/values.yaml shoppingAssistantService)"; exit 1; }
            done
            grep -q 'name: ASSISTANT_URL' "$r" || { echo "::error::${env}: the frontend has no ASSISTANT_URL"; exit 1; }
            # Cost guards (src/shoppingassistantservice/server.py reads them)
            replicas=$(yq ea -N 'select(.kind == "Deployment" and .metadata.name == "shoppingassistantservice") | .spec.replicas' "$r")
            [ "$replicas" = "1" ] || { echo "::error::${env}: ${replicas} assistant replicas: the daily cap is per pod, keep 1"; exit 1; }
            if yq ea -N 'select(.kind == "HorizontalPodAutoscaler") | .spec.scaleTargetRef.name' "$r" | grep -qx shoppingassistantservice; then
              echo "::error::${env}: an HPA scales the assistant: the daily cap is per pod"; exit 1
            fi
            tokens=$(deployed "$env" MAX_TOKENS); timeout=$(deployed "$env" REQUEST_TIMEOUT_SECONDS)
            rate=$(deployed "$env" RATE_PER_MINUTE); cap=$(deployed "$env" DAILY_QUESTION_CAP)
            for v in "$tokens" "$timeout" "$rate" "$cap"; do
              [[ "$v" =~ ^[0-9]+$ ]] || { echo "::error::${env}: an assistant limit is missing or not a number (MAX_TOKENS=${tokens} REQUEST_TIMEOUT_SECONDS=${timeout} RATE_PER_MINUTE=${rate} DAILY_QUESTION_CAP=${cap})"; exit 1; }
            done
            [ "$tokens" -le 600 ] && [ "$timeout" -le 15 ] && [ "$rate" -ge 1 ] && [ "$rate" -le 10 ] \
              || { echo "::error::${env}: assistant limits above the reviewed ones (MAX_TOKENS<=600, REQUEST_TIMEOUT_SECONDS<=15, RATE_PER_MINUTE 1-10)"; exit 1; }
            # The question size and tool steps use the code's defaults (500 characters, 3 steps).
            for var in MAX_QUESTION_CHARS MAX_TOOL_STEPS; do
              [ -z "$(deployed "$env" "$var")" ] || { echo "::error::${env}: ${var} is set: review the cost math (values-prod.yaml) first"; exit 1; }
            done
            total_cap=$((total_cap + cap))
            # Egress: DNS, the catalog (gRPC 3550), Bedrock (443), the Pod Identity Agent.
            egress=$(yq ea -N -o=json -I=0 'select(.kind == "NetworkPolicy" and .metadata.name == "shoppingassistantservice") | .spec.egress' "$r")
            for want in '"port":53' '"app":"productcatalogservice"' '"port":3550' '"port":443' '"cidr":"169.254.170.23/32"'; do
              grep -qF "$want" <<< "$egress" || { echo "::error::${env}: assistant NetworkPolicy egress misses ${want}"; exit 1; }
            done
            echo "${env}: ${tf_model} (inference profile: ${tf_profile}), cap ${cap}/day, ${tokens} tokens, ${timeout} s, ${rate}/min"
          done
          [ "$total_cap" -le 400 ] \
            || { echo "::error::dev + prod daily caps are ${total_cap}: at most 400 (Bedrock budget math in values-prod.yaml)"; exit 1; }
          echo "daily caps dev + prod: ${total_cap} (at most 400)"

      # Cost guard: the loadgenerator (and the load test) must never ask the AI assistant. A
      # Locust task on /assistant would spend the daily cap (and Bedrock money) on synthetic traffic.
      - name: Loadgenerator never calls the assistant
        run: |
          if grep -rniE 'assistant|/ask\b' src/loadgenerator deploy/load --include=*.py; then
            echo "::error::a Locust file mentions the assistant: synthetic traffic must never call /assistant"; exit 1
          fi
          for env in dev prod; do
            if yq ea -N 'select(.metadata.name == "loadgenerator" and (.kind == "Deployment")) | .spec.template.spec.containers[].env[] | .value // ""' "rendered-${env}.yaml" | grep -qi assistant; then
              echo "::error::${env}: the loadgenerator's environment points at the assistant"; exit 1
            fi
          done
          echo "no Locust task or loadgenerator setting targets the assistant"

      # Tracing switch (ADR 0010, steps 2, 4 and 7): on in dev and in prod for exactly the 12
      # traced services, each with its own name and environment. Every other service already
      # allows all egress; shoppingassistantservice alone has its collector rule (4317).
      # Uses the rendered files of the step above.
      - name: Tracing on in dev and prod
        run: |
          want="adservice cartservice checkoutservice currencyservice emailservice frontend inventoryservice paymentservice productcatalogservice recommendationservice shippingservice shoppingassistantservice"
          addr=$(yq '.tracing.collectorAddr' helm-chart/values.yaml)
          traced() { # rendered file -> workloads (Deployment, StatefulSet, Job, Rollout) with any tracing env var
            yq ea -N '[select(.spec.template.spec.containers) | select([.spec.template.spec.containers[].env[]?.name] | any_c(test("^(ENABLE_TRACING|COLLECTOR_SERVICE_ADDR|OTEL_.*)$"))) | .metadata.name] | unique | sort | join(" ")' "$1"
          }
          egress4317() { # rendered file -> NetworkPolicies with an egress rule on port 4317
            yq ea -N '[select(.kind == "NetworkPolicy") | select([.spec.egress[]?.ports[]?.port] | any_c(. == 4317)) | .metadata.name] | join(" ")' "$1"
          }
          for env in dev prod; do
            f="rendered-${env}.yaml"
            [ "$(traced "$f")" = "$want" ] || { echo "::error::${env} tracing env on '$(traced "$f")', want '${want}'"; exit 1; }
            for svc in $want; do
              envval() { yq ea -N "select(.kind == \"Deployment\" and .metadata.name == \"${svc}\") | .spec.template.spec.containers[0].env[] | select(.name == \"$1\") | .value" "$f"; }
              [ "$(envval ENABLE_TRACING)" = 1 ] && [ "$(envval COLLECTOR_SERVICE_ADDR)" = "$addr" ] && [ "$(envval OTEL_SERVICE_NAME)" = "$svc" ] \
                && [ "$(envval OTEL_RESOURCE_ATTRIBUTES)" = "deployment.environment=${env},service.namespace=boutique" ] \
                || { echo "::error::${env} ${svc}: tracing env incomplete or wrong"; exit 1; }
            done
            [ "$(egress4317 "$f")" = shoppingassistantservice ] \
              || { echo "::error::${env}: the 4317 egress rule must be on shoppingassistantservice only, found '$(egress4317 "$f")'"; exit 1; }
            # The other 11 must keep allowing all egress, or their spans never reach the collector.
            open=$(yq ea -N '[select(.kind == "NetworkPolicy" and .metadata.name != "deny-all" and .metadata.name != "shoppingassistantservice" and .metadata.name != "loadgenerator") | select(.spec.egress | any_c(length == 0)) | .metadata.name] | sort | join(" ")' "$f")
            [ "$open" = "$(echo "$want" | tr ' ' '\n' | grep -v shoppingassistantservice | paste -sd' ')" ] \
              || { echo "::error::${env}: these NetworkPolicies must allow all egress (spans to the collector): got '${open}'"; exit 1; }
          done
          echo "tracing: dev and prod on for ${want} (collector ${addr})"

      # Frontend canary (ADR 0008): the loadgenerator must give the canary 3x the request-volume
      # gate at its first check, or a healthy canary is aborted for lack of traffic (RUNBOOK 10).
      - name: Canary gets enough traffic
        run: |
          # Requests per second per Locust user (wait 1-10 s between tasks), measured in prod: 5 users gave
          # about 0.7/s. Keep it conservative: it is what the canary math below relies on.
          per_user=0.14
          secs() { case "$1" in *m) echo $(( ${1%m} * 60 ));; *s) echo "${1%s}";; *) echo "$1";; esac; }
          for env in dev prod; do
            f="rendered-${env}.yaml"
            users=$(yq ea -N 'select(.kind == "Deployment" and .metadata.name == "loadgenerator") | .spec.template.spec.containers[] | select(.name == "main") | .env[] | select(.name == "USERS") | .value' "$f")
            weight=$(yq ea -N 'select(.kind == "Rollout") | [.spec.strategy.canary.steps[] | select(has("setWeight"))][0].setWeight' "$f")
            metric() { yq ea -N "select(.kind == \"AnalysisTemplate\") | .spec.metrics[] | select(.name == \"request-volume\") | $1" "$f"; }
            delay=$(secs "$(metric .initialDelay)")
            window=$(secs "$(metric .provider.prometheus.query | grep -o '\[[0-9]*[sm]\]' | tr -d '[]')")
            min=$(metric .successCondition | sed -n 's/.*>= *\([0-9.]*\).*/\1/p')
            # The first check (initialDelay after the analysis starts at the first weight) sees at most
            # initialDelay seconds of canary traffic, never more than the window.
            seen=$(( delay < window ? delay : window ))
            expected=$(awk -v u="$users" -v r="$per_user" -v w="$weight" -v s="$seen" 'BEGIN { printf "%.1f", u * r * w / 100 * s }')
            echo "${env}: ${users} users x ${per_user}/s x ${weight}% x ${seen} s = ${expected} canary requests at the first check (gate ${min}, window ${window} s)"
            awk -v e="$expected" -v m="$min" 'BEGIN { exit !(e >= 3 * m) }' \
              || { echo "::error::${env}: the canary's first request-volume check expects ${expected} requests, less than 3x its gate (${min}). Raise loadGenerator.users (RUNBOOK section 10)."; exit 1; }
          done

      # The frontend canary analysis and Grafana query Prometheus by its in-cluster address.
      # Render kube-prometheus-stack exactly as deploy/monitoring.sh installs it (release
      # "monitoring", namespace "monitoring", same values, the chart version from deploy.yml)
      # and check both addresses name the Prometheus Service it really creates.
      - name: Prometheus address matches the monitoring chart
        run: |
          kps=$(sed -n 's/^ *KPS_VERSION: "\([^"]*\)".*/\1/p' .github/workflows/deploy.yml)
          [ -n "$kps" ] || { echo "::error::KPS_VERSION not found in deploy.yml"; exit 1; }
          helm template monitoring kube-prometheus-stack \
            --repo https://prometheus-community.github.io/helm-charts --version "$kps" \
            --namespace monitoring -f monitoring/kube-prometheus-stack.values.yaml > kps.yaml
          svc=$(yq ea -N 'select(.kind == "Service" and (.metadata.name | test("-prometheus$")) and ([.spec.ports[].port] | contains([9090])))
                | "http://" + .metadata.name + "." + (.metadata.namespace // "monitoring") + ".svc:9090"' kps.yaml)
          [ "$(wc -l <<<"$svc")" = 1 ] && [ -n "$svc" ] \
            || { echo "::error::expected one Prometheus Service on port 9090 in the rendered chart, found: ${svc:-none}"; exit 1; }
          echo "kube-prometheus-stack ${kps}: Prometheus Service ${svc}"
          canary=$(yq '.frontend.canary.analysis.prometheusAddress' helm-chart/values.yaml)
          grafana=$(yq '.grafana.additionalDataSources[] | select(.uid == "prometheus") | .url' monitoring/kube-prometheus-stack.values.yaml)
          for pair in "canary analysis (helm-chart/values.yaml)=${canary}" "Grafana data source (monitoring values)=${grafana}"; do
            [ "${pair#*=}" = "$svc" ] \
              || { echo "::error::${pair%%=*} is ${pair#*=}, but the monitoring chart's Prometheus is ${svc}"; exit 1; }
          done
          for f in helm-chart/values-aws.yaml helm-chart/values-dev.yaml helm-chart/values-prod.yaml; do
            [ "$(yq '.frontend.canary.analysis.prometheusAddress // ""' "$f")" = "" ] \
              || { echo "::error::${f} overrides prometheusAddress: keep it in helm-chart/values.yaml only"; exit 1; }
          done

      # Tracing backend (ADR 0010): both charts render with the exact versions in deploy.yml, keep
      # the ADR's shape, and the rendered configs start in the real images. The collector checks
      # tail sampling policies and OTTL only when its pipeline starts, not in "validate".
      - name: Tracing backend (Tempo + OTel Collector)
        run: |
          pin() { sed -n "s/^ *$1: \"\([^\"]*\)\".*/\1/p" .github/workflows/deploy.yml; }
          tempo_v=$(pin TEMPO_CHART_VERSION); otel_v=$(pin OTEL_COLLECTOR_CHART_VERSION)
          [ -n "$tempo_v" ] && [ -n "$otel_v" ] \
            || { echo "::error::TEMPO_CHART_VERSION or OTEL_COLLECTOR_CHART_VERSION not found in deploy.yml"; exit 1; }
          helm template tempo tempo --repo https://grafana-community.github.io/helm-charts \
            --version "$tempo_v" --namespace monitoring -f monitoring/tempo.values.yaml > tempo.yaml
          helm template otel-collector opentelemetry-collector --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
            --version "$otel_v" --namespace monitoring -f monitoring/otel-collector.values.yaml > otel.yaml
          fail() { echo "::error::$1"; exit 1; }

          # Tempo: OTLP receivers only, 2 GiB local disk, no usage reports.
          yq ea -N 'select(.kind == "ConfigMap" and .metadata.name == "tempo") | .data["tempo.yaml"]' tempo.yaml > tempo-config.yaml
          yq ea -N 'select(.kind == "ConfigMap" and .metadata.name == "tempo") | .data["overrides.yaml"]' tempo.yaml > tempo-overrides.yaml
          [ "$(yq '.distributor.receivers | keys | join(",")' tempo-config.yaml)" = otlp ] || fail "Tempo must have OTLP receivers only"
          [ "$(yq '.usage_report.reporting_enabled' tempo-config.yaml)" = false ] || fail "Tempo usage reports must be off"
          [ "$(yq ea -N 'select(.kind == "StatefulSet") | .spec.template.spec.volumes[] | select(.name == "tempo-data") | .emptyDir.sizeLimit' tempo.yaml)" = 2Gi ] \
            || fail "Tempo traces must be on the 2Gi emptyDir"
          # Collector: one replica (tail sampling), and a ClusterRole limited to k8s_attributes' needs.
          [ "$(yq ea -N 'select(.kind == "Deployment") | .spec.replicas' otel.yaml)" = 1 ] \
            || fail "the collector must run 1 replica: tail sampling needs all spans of a trace on one instance (ADR 0010)"
          [ "$(yq ea -N 'select(.kind == "ClusterRole") | [.rules[].resources[]] | sort | join(",")' otel.yaml)" = namespaces,pods,replicasets ] \
            || fail "the collector's ClusterRole must cover pods, namespaces and replicasets only"
          [ "$(yq ea -N 'select(.kind == "ClusterRole") | [.rules[].verbs[]] | unique | sort | join(",")' otel.yaml)" = get,list,watch ] \
            || fail "the collector's ClusterRole must be read-only (get, list, watch)"

          # Start both with the rendered config. k8s_attributes needs a cluster: left out here.
          yq ea -N 'select(.kind == "ConfigMap" and .metadata.name == "otel-collector") | .data.relay' otel.yaml \
            | yq 'del(.processors.k8s_attributes) | .service.pipelines["traces/in"].processors -= ["k8s_attributes"]' > relay.yaml
          otel_image=$(yq ea -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].image' otel.yaml)
          tempo_image=$(yq ea -N 'select(.kind == "StatefulSet") | .spec.template.spec.containers[0].image' tempo.yaml)
          docker run -d --name tempo-check -v "$PWD/tempo-config.yaml:/conf/tempo.yaml:ro" \
            -v "$PWD/tempo-overrides.yaml:/conf/overrides.yaml:ro" --tmpfs /var/tempo:uid=10001,gid=10001 \
            "$tempo_image" -config.file=/conf/tempo.yaml -mem-ballast-size-mbs=0 >/dev/null
          docker run -d --name otel-check -e MY_POD_IP=127.0.0.1 -e OTEL_K8S_NAMESPACE=monitoring \
            -e OTEL_K8S_NODE_NAME=ci -e OTEL_K8S_NODE_IP=127.0.0.1 -e OTEL_K8S_POD_NAME=otel-check \
            -e OTEL_K8S_POD_IP=127.0.0.1 -v "$PWD/relay.yaml:/conf/relay.yaml:ro" \
            "$otel_image" --config=/conf/relay.yaml >/dev/null
          sleep 25
          for c in otel-check tempo-check; do
            echo "--- ${c} (last lines)"; docker logs --tail 15 "$c" 2>&1
          done
          docker logs otel-check 2>&1 | grep -q "Everything is ready" \
            && [ "$(docker inspect -f '{{.State.Running}}' otel-check)" = true ] \
            || fail "the collector (${otel_image}) did not start with the rendered config"
          [ "$(docker inspect -f '{{.State.Running}}' tempo-check)" = true ] \
            && ! docker logs tempo-check 2>&1 | grep -qE 'level=(error|fatal)' \
            || fail "Tempo (${tempo_image}) did not start with the rendered config"
          docker rm -f otel-check tempo-check >/dev/null
          echo "Tempo chart ${tempo_v} (${tempo_image}) and collector chart ${otel_v} (${otel_image}): render and start OK"

  build:
    name: build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # Build only, nothing is pushed: proves the Dockerfile still works.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}

  ci-ok:
    if: always()
    needs: [changes, tests, go-tests, node-tests, dotnet-tests, secrets, helm, build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS"
