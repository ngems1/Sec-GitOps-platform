name: deploy

# Builds the 12 service images, pushes them to ECR and deploys them to EKS.
#
#   push to main  -> build + scan -> dev (automatic) -> prod (after a reviewer approves)
#   manual run    -> the same, or redeploy an image tag that already exists
#                    (rollback: give the commit SHA of a previous good build)
#
# The same images go to dev and prod: prod gets exactly what was tested in dev.
# Each environment's steps are in deploy-env.yml.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "helm-chart/**"
      - "db/**"
      - "deploy/**"
      - "monitoring/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-env.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy this existing image tag (12-character commit SHA) instead of building. Empty = build this commit."
        type: string
        default: ""
      target:
        description: "Where to deploy"
        type: choice
        options: [dev-then-prod, dev-only]
        default: dev-then-prod

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # Supply chain (ADR 0012), for the build job and the rollback signing job: exact versions,
  # checked by SHA-256 (the release's checksums file).
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 # cosign-linux-amd64
  SYFT_VERSION: "1.54.1"
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47   # syft_1.54.1_linux_amd64.tar.gz
  # Who signs: this workflow on main (the deploy role only trusts main). Kyverno checks the same
  # values (docs/week3/IMAGE-SIGNING.md).
  SIGNER_IDENTITY: https://github.com/ngems1/Sec-GitOps-platform/.github/workflows/deploy.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # Picks the image tag and checks the AWS side exists.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
      registry: ${{ steps.tf.outputs.registry }}
    steps:
      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform's outputs are read straight from its state file in S3 (read-only,
      # no terraform init needed). Run the infra workflow first.
      - name: Read Terraform outputs
        id: tf
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          registry=$(jq -r '.outputs.ecr_registry.value // empty' state.json)
          if [ -z "$registry" ]; then
            echo "::error::No Terraform outputs found. Run the infra workflow (apply) first."
            exit 1
          fi
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

      - name: Choose the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.tf.outputs.registry }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Rollback / redeploy: every image must already exist with that tag.
            missing=0
            for svc in adservice cartservice checkoutservice currencyservice emailservice frontend \
                       inventoryservice loadgenerator paymentservice productcatalogservice \
                       recommendationservice shippingservice shoppingassistantservice; do
              aws ecr describe-images --repository-name "${REGISTRY#*/}/${svc}" \
                --image-ids imageTag="$INPUT_TAG" >/dev/null 2>&1 || { echo "::error::${svc}:${INPUT_TAG} not found in ECR"; missing=1; }
            done
            [ "$missing" = 0 ] || exit 1
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Redeploying existing tag ${INPUT_TAG} (no build)."
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # One job per service, in parallel.
  build:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: adservice,             context: src/adservice }
          - { service: cartservice,           context: src/cartservice/src }
          - { service: checkoutservice,       context: src/checkoutservice }
          - { service: currencyservice,       context: src/currencyservice }
          - { service: emailservice,          context: src/emailservice }
          - { service: frontend,              context: src/frontend }
          - { service: inventoryservice,      context: src/inventoryservice }
          - { service: loadgenerator,         context: src/loadgenerator }
          - { service: paymentservice,        context: src/paymentservice }
          - { service: productcatalogservice, context: src/productcatalogservice }
          - { service: recommendationservice, context: src/recommendationservice }
          - { service: shippingservice,       context: src/shippingservice }
          - { service: shoppingassistantservice, context: src/shoppingassistantservice }
    env:
      IMAGE: ${{ needs.setup.outputs.registry }}/${{ matrix.service }}:${{ needs.setup.outputs.tag }}
      REPO: ${{ matrix.service }}
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable in ECR: if this commit was already built (a re-run), reuse it.
      - name: Already built?
        id: exists
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
        run: |
          if aws ecr describe-images --repository-name "${REGISTRY#*/}/${REPO}" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE} already exists, skipping the build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found == 'false'

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false # one plain image manifest, which ECR scanning reads directly
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ needs.setup.outputs.tag }} # shown in the frontend footer
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Security gate: ECR scans every pushed image (scan on push, set in Terraform).
      # A CRITICAL finding stops the deployment before anything reaches the cluster.
      # (ECR's scanner is used instead of a third-party scanner action, so no extra
      # code runs with AWS credentials. See the Trivy supply-chain compromise, March 2026.)
      - name: Vulnerability scan gate
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          BLOCKING: ${{ vars.SCAN_BLOCKING || 'true' }}
        run: |
          repo="${REGISTRY#*/}/${REPO}"
          aws ecr wait image-scan-complete --repository-name "$repo" --image-id imageTag="$TAG" || true
          result=$(aws ecr describe-image-scan-findings --repository-name "$repo" --image-id imageTag="$TAG" --output json || echo '{}')
          status=$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$result")
          counts=$(jq -c '.imageScanFindings.findingSeverityCounts // {}' <<<"$result")
          critical=$(jq -r '.CRITICAL // 0' <<<"$counts")
          high=$(jq -r '.HIGH // 0' <<<"$counts")
          {
            echo "| Image | Scan | Critical | High |"
            echo "|---|---|---|---|"
            echo "| ${REPO}:${TAG} | ${status} | ${critical} | ${high} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Scan ${status}: ${counts}"
          if [ "$status" != "COMPLETE" ]; then
            echo "::warning::${REPO}: scan status ${status} ($(jq -r '.imageScanStatus.description // ""' <<<"$result"))"
          elif [ "$critical" -gt 0 ]; then
            jq -r '.imageScanFindings.findings[] | select(.severity=="CRITICAL") | "  \(.name)  \(.uri // "")"' <<<"$result" | head -20
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::${REPO}: ${critical} CRITICAL vulnerabilities. Update the base image or dependencies (or set the repository variable SCAN_BLOCKING=false to only report)."
              exit 1
            fi
            echo "::warning::${REPO}: ${critical} CRITICAL vulnerabilities (SCAN_BLOCKING=false, not blocking)."
          fi

      # Supply chain (ADR 0012): an SBOM, a keyless signature and the SBOM as a signed attestation,
      # all by digest, after the scan gate (only images that passed it are signed). Also on a
      # re-run of an image that already exists: what is already signed is left as it is.
      - name: Install cosign and Syft
        run: |
          d="$RUNNER_TEMP/bin"; mkdir -p "$d"; cd "$d"
          curl -sSfLo cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          curl -sSfLo syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && rm syft.tgz
          chmod +x cosign syft
          echo "$d" >> "$GITHUB_PATH"

      # The digest ECR holds for this tag: what the clusters pull, and what gets signed.
      - name: Image digest
        id: digest
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
        run: |
          digest=$(aws ecr describe-images --repository-name "${REGISTRY#*/}/${REPO}" \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${REPO}:${TAG}: no image digest in ECR (got '${digest}')"; exit 1; }
          echo "ref=${REGISTRY}/${REPO}@${digest}" >> "$GITHUB_OUTPUT"
          echo "${REPO}:${TAG} = ${digest}"

      - name: SBOM (Syft, SPDX JSON)
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          syft scan "registry:${REF}" -q -o "spdx-json=sbom-${REPO}.spdx.json"
          echo "SBOM: $(jq '.packages | length' "sbom-${REPO}.spdx.json") packages"

      - name: Sign the image and attest the SBOM (cosign keyless)
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          # The certificate will name this workflow and ref: they must be what Kyverno expects.
          [ "$SIGNER_IDENTITY" = "https://github.com/${GITHUB_WORKFLOW_REF}" ] \
            || { echo "::error::this run would sign as https://github.com/${GITHUB_WORKFLOW_REF}, not ${SIGNER_IDENTITY}"; exit 1; }
          bash deploy/sign-image.sh sign "$REF" "sbom-${REPO}.spdx.json"

      # Fails the build when the signature or the attestation does not verify with the exact
      # identity and issuer, so a broken signing setup cannot pass silently.
      - name: Verify the signature and the SBOM attestation
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: bash deploy/sign-image.sh verify "$REF"

      - name: Upload the SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  # Rollback / redeploy of an existing tag (image_tag input, no build): signs and attests the 13
  # images of that tag with the same identity as a build, before anything is deployed (ADR 0012,
  # note 2026-10-18). Nothing is rebuilt or rescanned:
  #   already signed and attested (any image built since ADR 0012): verified, nothing else;
  #   not yet (older images): the build's scan gate on the image's existing ECR findings, then
  #     the SBOM, the signature, the attestation and the same verification as the build job.
  # A tag that cannot be signed or verified fails here, and dev and prod are not deployed.
  sign-rollback:
    needs: setup
    if: needs.setup.outputs.build == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [adservice, cartservice, checkoutservice, currencyservice, emailservice, frontend,
                  inventoryservice, loadgenerator, paymentservice, productcatalogservice,
                  recommendationservice, shippingservice, shoppingassistantservice]
    env:
      REPO: ${{ matrix.service }}
      TAG: ${{ needs.setup.outputs.tag }}
      REGISTRY: ${{ needs.setup.outputs.registry }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The same tools, versions and checks as the build job.
      - name: Install cosign and Syft
        run: |
          d="$RUNNER_TEMP/bin"; mkdir -p "$d"; cd "$d"
          curl -sSfLo cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          curl -sSfLo syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && rm syft.tgz
          chmod +x cosign syft
          echo "$d" >> "$GITHUB_PATH"

      - name: Image digest
        id: digest
        run: |
          digest=$(aws ecr describe-images --repository-name "${REGISTRY#*/}/${REPO}" \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${REPO}:${TAG}: no image digest in ECR (got '${digest}')"; exit 1; }
          echo "ref=${REGISTRY}/${REPO}@${digest}" >> "$GITHUB_OUTPUT"
          echo "${REPO}:${TAG} = ${digest}"

      - name: Already signed and attested?
        id: signed
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          if bash deploy/sign-image.sh status "$REF"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "${REPO}:${TAG} is already signed and attested by ${SIGNER_IDENTITY}: nothing to sign."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "${REPO}:${TAG} is not signed and attested yet: signing it now."
          fi

      # Only images that passed the scan gate are signed: the build job's rule, on the image's
      # existing ECR findings (scan on push; nothing is rescanned). A tag whose build stopped at
      # the gate is refused here too.
      - name: Vulnerability scan gate (existing findings)
        if: steps.signed.outputs.done == 'false'
        env:
          BLOCKING: ${{ vars.SCAN_BLOCKING || 'true' }}
        run: |
          repo="${REGISTRY#*/}/${REPO}"
          result=$(aws ecr describe-image-scan-findings --repository-name "$repo" --image-id imageTag="$TAG" --output json || echo '{}')
          status=$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$result")
          counts=$(jq -c '.imageScanFindings.findingSeverityCounts // {}' <<<"$result")
          critical=$(jq -r '.CRITICAL // 0' <<<"$counts")
          high=$(jq -r '.HIGH // 0' <<<"$counts")
          {
            echo "| Image (rollback) | Scan | Critical | High |"
            echo "|---|---|---|---|"
            echo "| ${REPO}:${TAG} | ${status} | ${critical} | ${high} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Scan ${status}: ${counts}"
          if [ "$status" != "COMPLETE" ]; then
            echo "::warning::${REPO}: scan status ${status} ($(jq -r '.imageScanStatus.description // ""' <<<"$result"))"
          elif [ "$critical" -gt 0 ]; then
            jq -r '.imageScanFindings.findings[] | select(.severity=="CRITICAL") | "  \(.name)  \(.uri // "")"' <<<"$result" | head -20
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::${REPO}:${TAG}: ${critical} CRITICAL vulnerabilities: not signed, not deployed. Roll back to another tag (or set SCAN_BLOCKING=false to only report)."
              exit 1
            fi
            echo "::warning::${REPO}: ${critical} CRITICAL vulnerabilities (SCAN_BLOCKING=false, not blocking)."
          fi

      - name: SBOM (Syft, SPDX JSON)
        if: steps.signed.outputs.done == 'false'
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          syft scan "registry:${REF}" -q -o "spdx-json=sbom-${REPO}.spdx.json"
          echo "SBOM: $(jq '.packages | length' "sbom-${REPO}.spdx.json") packages"

      - name: Sign the image and attest the SBOM (cosign keyless)
        if: steps.signed.outputs.done == 'false'
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          [ "$SIGNER_IDENTITY" = "https://github.com/${GITHUB_WORKFLOW_REF}" ] \
            || { echo "::error::this run would sign as https://github.com/${GITHUB_WORKFLOW_REF}, not ${SIGNER_IDENTITY}"; exit 1; }
          bash deploy/sign-image.sh sign "$REF" "sbom-${REPO}.spdx.json"

      # Always, also when it was already signed: the same check as the build job and Kyverno.
      - name: Verify the signature and the SBOM attestation
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: bash deploy/sign-image.sh verify "$REF"

      - name: Upload the SBOM
        if: steps.signed.outputs.done == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  deploy-dev:
    # After monitoring: the frontend canary analysis queries its Prometheus, and deploy-env
    # checks that Prometheus answers before any canary. A failed monitoring job does not block
    # dev (that check decides whether a canary can run).
    needs: [setup, build, sign-rollback, monitoring]
    # Runs after a successful build, or, when redeploying an existing tag, after its images are
    # signed and verified (sign-rollback). Each of the two is skipped when the other runs.
    if: >-
      always() && needs.setup.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.sign-rollback.result == 'success' || needs.sign-rollback.result == 'skipped')
      && (needs.build.result == 'success' || needs.sign-rollback.result == 'success')
      && needs.monitoring.result != 'cancelled'
    uses: ./.github/workflows/deploy-env.yml
    secrets: inherit # SLACK_ORDERS_WEBHOOK_URL (optional) for the order notifications
    with:
      environment: dev
      image_tag: ${{ needs.setup.outputs.tag }}

  deploy-prod:
    needs: [setup, deploy-dev]
    if: always() && needs.deploy-dev.result == 'success' && inputs.target != 'dev-only'
    uses: ./.github/workflows/deploy-env.yml
    secrets: inherit # SLACK_ORDERS_WEBHOOK_URL (optional) for the order notifications
    with:
      environment: prod
      image_tag: ${{ needs.setup.outputs.tag }}

  # Prometheus + Grafana and the tracing backend (Tempo + OTel Collector, ADR 0010), in namespace
  # "monitoring", shared by dev and prod: installed or updated BEFORE dev, in parallel with the
  # build, because the frontend canary analysis (ADR 0008) needs Prometheus. On a brand-new
  # cluster the Grafana ALB appears once the Load Balancer Controller exists (after the first
  # dev deploy). Skipped with a notice until the GRAFANA_ADMIN_PASSWORD secret is set (docs/week3/MONITORING.md).
  monitoring:
    needs: setup
    if: needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      grafana_url: ${{ steps.install.outputs.GRAFANA_URL }}
    env:
      # Exact, like the tracing charts: a chart upgrade restarts Prometheus (its 24 h of metrics are
      # lost), so it is done on purpose and alone, never as a side effect of a deploy (RUNBOOK 12).
      KPS_VERSION: "89.2.4"                     # kube-prometheus-stack, the version running since 2026-09
      # Tracing backend (ADR 0010): exact versions, upgraded by hand.
      TEMPO_CHART_VERSION: "2.4.0"              # grafana-community/tempo, Tempo 2.10.8 (single binary)
      OTEL_COLLECTOR_CHART_VERSION: "0.174.2"   # open-telemetry/opentelemetry-collector, Collector 0.161.0
      # Smoke test images (deploy/tracing-smoke.sh)
      TELEMETRYGEN_IMAGE: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
      CURL_IMAGE: docker.io/curlimages/curl:8.22.0
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Connect kubectl to the cluster
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          CLUSTER=$(jq -r '.outputs.cluster_name.value' state.json)
          {
            echo "GRAFANA_HOST=$(jq -r '.outputs.tls.value.hosts.monitoring // empty' state.json)"
            echo "CERT_ARN=$(jq -r '.outputs.tls.value.certificate_arn // empty' state.json)"
            echo "DNS_ZONE_ID=$(jq -r '.outputs.tls.value.zone_id // empty' state.json)"
            echo "VPC_CIDR=$(jq -r '.outputs.vpc_cidr.value // "10.0.0.0/16"' state.json)"
          } >> "$GITHUB_ENV"
          rm -f state.json
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Install Prometheus + Grafana + tracing backend
        id: install
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          MONITORING_ALLOWED_CIDR: ${{ vars.MONITORING_ALLOWED_CIDR }}
        run: |
          if [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "::notice::Monitoring skipped: set the GRAFANA_ADMIN_PASSWORD repository secret (docs/week3/MONITORING.md)."
            exit 0
          fi
          bash deploy/monitoring.sh

      # ADR 0010: test traces from boutique-dev, one with an error, must be found in Tempo
      # through Grafana's data source. Same condition as the install (it needs Grafana).
      - name: Tracing smoke test
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "::notice::Tracing smoke test skipped: the monitoring stack was not installed."
            exit 0
          fi
          unset GRAFANA_ADMIN_PASSWORD   # only used to decide; the Job reads the login from its Secret
          bash deploy/tracing-smoke.sh

  # Kyverno (ADR 0013), AUDIT ONLY: reports pods in boutique-dev and boutique-prod whose images
  # from our ECR lack the signature or SBOM attestation of ADR 0012. It never blocks or changes a
  # pod, so it runs beside the deploy and nothing waits for it (RUNBOOK section 16).
  policies:
    needs: setup
    if: needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KYVERNO_CHART_VERSION: "3.9.1" # kyverno/kyverno, Kyverno v1.19.1; upgraded by hand, never "latest"
      ECR_REGISTRY: ${{ needs.setup.outputs.registry }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Connect kubectl to the cluster
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          aws eks update-kubeconfig --name "$(jq -r '.outputs.cluster_name.value' state.json)" --region "$AWS_REGION"
          rm -f state.json

      - name: Install Kyverno and the image-signature policy (audit)
        run: bash deploy/kyverno.sh

  # Proves dev can't reach prod (network + IAM), once both are on the new version.
  isolation-test:
    needs: deploy-prod
    if: always() && needs.deploy-prod.result == 'success'
    uses: ./.github/workflows/isolation-test.yml

  # --- Slack (deploy/notify-slack.sh; silent when the SLACK_WEBHOOK_URL secret is unset)
  notify-approval:
    needs: [setup, deploy-dev]
    if: needs.deploy-dev.result == 'success' && inputs.target != 'dev-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prod is waiting for approval
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ needs.setup.outputs.tag }}
          DEV_URL: ${{ needs.deploy-dev.outputs.url }}
        run: |
          bash deploy/notify-slack.sh warning "Prod is waiting for your approval" \
            "Version \`${TAG}\` passed dev: ${DEV_URL}"$'\n'"Approve it in the run: *Review deployments*."

  notify:
    needs: [setup, build, sign-rollback, deploy-dev, deploy-prod, isolation-test, monitoring]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deployment result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ needs.setup.outputs.tag || 'none' }}
          BUILD: ${{ needs.build.result }}
          SIGN_ROLLBACK: ${{ needs.sign-rollback.result }}
          DEV: ${{ needs.deploy-dev.result }}
          PROD: ${{ needs.deploy-prod.result }}
          ISOLATION: ${{ needs.isolation-test.result }}
          SETUP: ${{ needs.setup.result }}
          DEV_URL: ${{ needs.deploy-dev.outputs.url }}
          PROD_URL: ${{ needs.deploy-prod.outputs.url }}
          GRAFANA_URL: ${{ needs.monitoring.outputs.grafana_url }}
        run: |
          icon() { case "$1" in success) echo ":white_check_mark:";; skipped) echo ":fast_forward:";; cancelled) echo ":no_entry_sign:";; *) echo ":x:";; esac; }
          if [ "$SIGN_ROLLBACK" = skipped ]; then
            text="$(icon "$SETUP") setup   $(icon "$BUILD") build + scan"
          else
            text="$(icon "$SETUP") setup   $(icon "$SIGN_ROLLBACK") rollback signing"
          fi
          text+="   $(icon "$DEV") dev   $(icon "$PROD") prod   $(icon "$ISOLATION") isolation test"
          [ -n "$DEV_URL" ] && text+=$'\n'"Dev: ${DEV_URL}"
          [ -n "$PROD_URL" ] && text+=$'\n'"Prod: ${PROD_URL}"
          [ -n "$GRAFANA_URL" ] && text+=$'\n'"Grafana: ${GRAFANA_URL}"
          if [ "$PROD" = success ] && [ "$ISOLATION" = success ]; then
            color=good; title="Deployed \`${TAG}\` to dev and prod"
          elif [ "$DEV" = success ] && [ "$PROD" = skipped ]; then
            color=good; title="Deployed \`${TAG}\` to dev"
          elif [ "$PROD" = success ]; then
            color=warning; title="Deployed \`${TAG}\`, but the isolation test did not pass"
          else
            color=danger; title="Deployment of \`${TAG}\` failed"
          fi
          bash deploy/notify-slack.sh "$color" "$title" "$text"
