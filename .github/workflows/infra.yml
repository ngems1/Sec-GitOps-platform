name: infra

# Terraform for the AWS side of Week 3: shared VPC, EKS and ECR, plus one full set
# of data stores, queues, Lambda and IAM roles for dev and for prod. Runs with short-lived AWS credentials via GitHub OIDC.
#
#   pull request  -> fmt / validate / Checkov / plan (nothing is changed)
#   push to main  -> plan + apply
#   manual run    -> choose plan, apply or destroy (Actions tab > infra > Run workflow)

on:
  pull_request:
    paths: ["terraform-aws/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["terraform-aws/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # needed for GitHub OIDC -> AWS
  contents: read

concurrency:
  group: terraform-state # never run two Terraform jobs against the same state
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }} # HTTPS: empty = plain http ALB addresses
  TF_VAR_ses_recipients: ${{ vars.SES_RECIPIENTS }} # order emails: verified recipients (SES sandbox)
  TF_VAR_budget_alerts_topic_arn: ${{ vars.BUDGET_ALERTS_TOPIC_ARN }} # Bedrock daily budget alerts to Slack (bootstrap output; empty = off)
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: terraform-aws
    steps:
      - uses: actions/checkout@v5

      # Pull requests get the read-only plan role; main / manual runs get the deploy role.
      # (Both are created by the bootstrap workflow, see docs/week3/BOOTSTRAP.md.)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The order-status Lambda talks to MySQL: bundle pymysql and the RDS CA
      # certificate next to its code, then run its unit tests.
      # No .pyc files (--no-compile, PYTHONDONTWRITEBYTECODE): they contain timestamps,
      # which would change the zip on every run and redeploy the Lambda for nothing.
      - name: Lambda dependencies + tests
        working-directory: terraform-aws/lambda/order_status
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install --quiet --no-compile --target . pymysql==1.1.1
          curl -sSfo global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          python -m unittest -v

      - name: Slack alerts Lambda tests
        working-directory: terraform-aws/lambda/slack_alerts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install --quiet boto3
          python -m unittest -v

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true # reported, not blocking yet

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=week3/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - name: terraform validate
        run: terraform validate

      - name: Checkov (IaC security scan)
        if: github.event_name == 'pull_request' || inputs.action == 'plan'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform-aws
          framework: terraform
          quiet: true
          soft_fail: true # findings are reviewed in the security notes, not blocking today

      - name: terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.action == 'apply'
        run: terraform apply -input=false tfplan

      - name: Show outputs
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.action == 'apply'
        run: terraform output

      # CloudWatch alarms reach Slack (alerts channel, its own webhook) through the
      # slack-alerts Lambda, which reads the webhook URL from Secrets Manager. Written here (not by Terraform) so the URL
      # never lands in the Terraform state. Only written when it changed.
      - name: Store the Slack webhook for alarms
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.action == 'apply'
        env:
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_ALERTS_WEBHOOK_URL" ]; then
            echo "::notice::No SLACK_ALERTS_WEBHOOK_URL secret: alarms are logged but not sent to Slack (docs/week3/SLACK.md)."
            exit 0
          fi
          secret_arn=$(terraform output -raw slack_webhook_secret_arn)
          current=$(aws secretsmanager get-secret-value --secret-id "$secret_arn" \
                      --query SecretString --output text 2>/dev/null || true)
          if [ "$current" = "$SLACK_ALERTS_WEBHOOK_URL" ]; then
            echo "Slack webhook already stored."
          else
            aws secretsmanager put-secret-value --secret-id "$secret_arn" \
              --secret-string "$SLACK_ALERTS_WEBHOOK_URL" >/dev/null
            echo "Alerts webhook stored: CloudWatch alarms will be posted to the alerts channel."
          fi

      # --- teardown ---------------------------------------------------------
      # The ALB is created by Kubernetes, not Terraform. Delete it first,
      # otherwise the VPC cannot be removed.
      - name: Remove load balancers created from Kubernetes
        if: inputs.action == 'destroy'
        continue-on-error: true
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          # dev./shop./grafana.<domain> point at these ALBs (created by the deploy workflow,
          # not by Terraform): remove them too, so no name points at a deleted ALB.
          tls=$(terraform output -json tls 2>/dev/null || echo null)
          if [ "$(jq -r '.zone_id // empty' <<<"$tls")" != "" ]; then
            export DNS_ZONE_ID=$(jq -r '.zone_id' <<<"$tls")
            for name in $(jq -r '.hosts[]' <<<"$tls"); do bash ../deploy/dns-record.sh delete "$name" || true; done
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl delete ingress --all --all-namespaces --wait=true --timeout=5m
          for ns in boutique-dev boutique-prod; do
            kubectl -n "$ns" delete svc frontend-external --ignore-not-found --wait=true --timeout=5m
          done
          sleep 60

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve

      # Applies and destroys change real infrastructure: tell the team in Slack.
      - name: Slack notification
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.action == 'apply' || inputs.action == 'destroy')
        working-directory: .
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ inputs.action || 'apply' }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then color=good; else color=danger; fi
          bash deploy/notify-slack.sh "$color" "Infrastructure ${ACTION}: ${STATUS}" "terraform ${ACTION} on the shared VPC, EKS and both environments."
