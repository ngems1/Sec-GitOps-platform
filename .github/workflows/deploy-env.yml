name: deploy-env

# Deploys one environment (dev or prod). Called by deploy.yml, never run on its own.
#
#   1. AWS Load Balancer Controller (shared by both environments, kept up to date)
#   2. Database migrations (a Job inside the cluster, RDS is private)
#   3. helm upgrade --install, rolled back automatically if the pods don't become ready
#   4. Smoke test through the ALB, rolled back to the previous release if it fails
#
# dev, once Argo CD runs it (the Application "boutique-dev", see argocd-install.yml):
# step 3 is a commit of the image tag to gitops/dev/values.yaml on main, then a wait
# until Argo CD has synced it; a failed smoke test reverts that commit. Before that,
# dev uses the Helm steps and the tag is committed after a passing smoke test.
#
# The job runs in the GitHub environment of the same name, so prod waits for the
# prod reviewers to approve, and AWS only lets the deploy role in from dev/prod/main.

on:
  workflow_call:
    inputs:
      environment:
        description: "dev or prod"
        type: string
        required: true
      image_tag:
        description: "Image tag to deploy (commit SHA)"
        type: string
        required: true
    outputs:
      url:
        description: "Shop address (ALB) of this environment"
        value: ${{ jobs.deploy.outputs.url }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: ${{ inputs.environment }}
  TAG: ${{ inputs.image_tag }}
  # Argo CD waits: a frontend canary (20% -> 2 min -> 50% -> 2 min -> 100%, ADR 0008) takes
  # about 6 min on top of the sync and pod start; 15 min leaves room without hiding a hang.
  ARGOCD_WAIT_SECONDS: "900"
  RELEASE: boutique
  HELM_VERSION: v4.3.0
  LBC_CHART_VERSION: 1.13.0 # AWS Load Balancer Controller v2.13.0, matches lbc_version in Terraform
  METRICS_SERVER_CHART_VERSION: 3.13.0 # metrics-server v0.8.0

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60 # two 15-min Argo CD waits (deploy + rollback) fit
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Everything Terraform created for this environment, read from its state file.
      - name: Read Terraform outputs
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          jq -e --arg env "$ENVIRONMENT" '.outputs.environments.value[$env]' state.json >/dev/null || {
            echo "::error::No '$ENVIRONMENT' settings in the Terraform outputs. Run the infra workflow (apply) first."
            exit 1
          }
          {
            echo "CLUSTER=$(jq -r '.outputs.cluster_name.value' state.json)"
            echo "VPC_ID=$(jq -r '.outputs.vpc_id.value' state.json)"
            echo "NS=$(jq -r --arg env "$ENVIRONMENT" '.outputs.environments.value[$env].namespace' state.json)"
            # HTTPS (terraform-aws/dns.tf): empty when no domain is set.
            echo "TLS_HOST=$(jq -r --arg env "$ENVIRONMENT" '.outputs.tls.value.hosts[$env] // empty' state.json)"
            echo "DNS_ZONE_ID=$(jq -r '.outputs.tls.value.zone_id // empty' state.json)"
          } >> "$GITHUB_ENV"

          # Helm values with this environment's names (JSON is valid YAML).
          jq --arg env "$ENVIRONMENT" --arg region "$AWS_REGION" '
            .outputs as $o | $o.environments.value[$env] as $e | {
              images:           { repository: $o.ecr_registry.value },
              frontend:         { ingress: {
                allowFromCidr:  ($o.vpc_cidr.value // "10.0.0.0/16"),
                certificateArn: ($o.tls.value.certificate_arn // "")
              } },
              cartDatabase:     { connectionString: $e.redis_endpoint },
              checkoutService:  { orders: {
                awsRegion:    $region,
                eventBusName: $e.event_bus_name,
                dbHost:       $e.db_host,
                dbPort:       $e.db_port,
                dbName:       $e.db_name,
                dbSecretArn:  $e.db_secret_arn
              } },
              inventoryService: {
                awsRegion:    $region,
                tableName:    $e.inventory_table,
                queueUrl:     $e.inventory_queue_url,
                eventBusName: $e.event_bus_name
              },
              productCatalogService: { catalog: {
                awsRegion:   $region,
                dbHost:      $e.db_host,
                dbPort:      ($e.db_port | tostring),
                dbName:      $e.db_name,
                dbSecretArn: $e.db_secret_arn,
                redisAddr:   $e.redis_endpoint
              } },
              # Steady read-only shoppers through the ALB name of this environment (frontend canary
              # analysis, ADR 0008). Empty without a domain: the loadgenerator stays in-cluster.
              loadGenerator:    { frontendUrl: (($o.tls.value.hosts[$env] // "") | if . == "" then "" else "https://" + . end) },
              emailService:     { notifications: {
                awsRegion: $region,
                queueUrl:  $e.notification_queue_url,
                tableName: $e.notifications_table,
                sesFromAddress: ($o.ses.value.from_address // ""),
                sesRecipients:  (($o.ses.value.recipients // []) | join(","))
              } }
            }' state.json > values-terraform.json
          cat values-terraform.json

      - name: Connect kubectl to the cluster
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl get nodes -o wide

      # CPU/memory numbers for the HPAs and "kubectl top" (APIService v1beta1.metrics.k8s.io).
      # Upstream chart instead of the EKS add-on, whose OpenAPI broke /openapi/v2 as protobuf
      # (RUNBOOK section 7). Both serve the same APIService, so the add-on must be gone first:
      # infra apply removes it. If it is still there, this step fails before touching anything.
      # The add-on is deleted with preserve = true (module default), which leaves its objects
      # behind. --take-ownership does not adopt them: Helm's server-side apply conflicts with
      # their field manager "before-first-apply" on the labels app.kubernetes.io/managed-by
      # and app.kubernetes.io/version. So every leftover the chart also creates is deleted
      # first, but only if it is not Helm's (label app.kubernetes.io/managed-by != Helm): a
      # re-run after a successful install deletes nothing.
      # First step after connecting: once the add-on is gone, APIService v1beta1.metrics.k8s.io
      # has no working backend and OpenAPI download fails, which breaks every later kubectl
      # apply ("failed to download openapi"). So this step only uses what works without
      # OpenAPI: aws eks describe-addon, kubectl get/delete/wait, helm with
      # --disable-openapi-validation.
      - name: metrics-server
        run: |
          if out=$(aws eks describe-addon --cluster-name "$CLUSTER" --addon-name metrics-server 2>&1); then
            echo "::error::The EKS add-on metrics-server is still installed. Run Actions > infra > apply (it removes the add-on), then re-run this deploy. See RUNBOOK section 7."
            exit 1
          elif ! grep -q ResourceNotFoundException <<<"$out"; then
            echo "::error::Could not check the EKS add-on metrics-server: ${out}"
            exit 1
          fi
          owner=$(kubectl -n kube-system get deployment metrics-server --ignore-not-found \
            -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}')
          if [ -n "$(kubectl -n kube-system get deployment metrics-server --ignore-not-found -o name)" ] && [ -z "$owner" ]; then
            echo "Deleting the Deployment kube-system/metrics-server left by the EKS add-on"
            kubectl -n kube-system delete deployment metrics-server --wait=true
          fi
          # Namespaced ones live in kube-system; -n is ignored for the cluster-scoped ones.
          for obj in \
            serviceaccount/metrics-server \
            service/metrics-server \
            rolebinding/metrics-server-auth-reader \
            poddisruptionbudget/metrics-server \
            clusterrole/system:metrics-server \
            clusterrole/system:metrics-server-aggregated-reader \
            clusterrolebinding/system:metrics-server \
            clusterrolebinding/metrics-server:system:auth-delegator \
            apiservice/v1beta1.metrics.k8s.io; do
            [ -n "$(kubectl -n kube-system get "$obj" --ignore-not-found -o name)" ] || continue
            managed_by=$(kubectl -n kube-system get "$obj" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}')
            if [ "$managed_by" != Helm ]; then
              echo "Deleting ${obj} (managed-by: '${managed_by}', left by the EKS add-on)"
              kubectl -n kube-system delete "$obj" --wait=true
            fi
          done
          helm upgrade --install metrics-server metrics-server \
            --disable-openapi-validation --take-ownership \
            --repo https://kubernetes-sigs.github.io/metrics-server/ --version "$METRICS_SERVER_CHART_VERSION" \
            --namespace kube-system \
            --set replicas=2 \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.maxUnavailable=1 \
            --set resources.requests.cpu=100m \
            --set resources.requests.memory=200Mi \
            --set resources.limits.cpu=500m \
            --set resources.limits.memory=400Mi \
            --rollback-on-failure --timeout 5m
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=3m
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=3m

      # Each environment: Argo CD deploys it once argocd-install.yml has created its
      # Application (boutique-dev, boutique-prod); until then the Helm steps below do.
      # Never both: the Helm steps are skipped as soon as the Application exists.
      - name: Who deploys (Argo CD or Helm)
        id: mode
        run: |
          # An API error fails the step: it must never fall back to Helm by mistake.
          argocd=false
          crd=$(kubectl get crd applications.argoproj.io --ignore-not-found -o name)
          app=""
          [ -z "$crd" ] || app=$(kubectl -n argocd get application "boutique-${ENVIRONMENT}" --ignore-not-found -o name)
          [ -z "$app" ] || argocd=true
          if [ "$argocd" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::${ENVIRONMENT} is deployed by Argo CD from main. Run the deploy from main (this run: ${GITHUB_REF})."
              exit 1
            fi
          fi
          echo "argocd=${argocd}" >> "$GITHUB_OUTPUT"
          echo "${ENVIRONMENT} is deployed by: $([ "$argocd" = true ] && echo "Argo CD (boutique-${ENVIRONMENT})" || echo Helm)"

      # The frontend runs as an Argo Rollout (ADR 0008): without the Rollouts CRDs, Argo CD
      # (or Helm) cannot apply it. Fail here, before anything is committed or upgraded.
      - name: Argo Rollouts installed
        run: |
          if [ -z "$(kubectl get crd rollouts.argoproj.io --ignore-not-found -o name)" ]; then
            echo "::error::The Argo Rollouts CRDs are missing. Run Actions > argocd-install (it installs the Argo Rollouts controller), then re-run this deploy."
            exit 1
          fi
          if [ -z "$TLS_HOST" ]; then
            echo "::warning::No domain (DOMAIN_NAME): the loadgenerator cannot reach the frontend canary through the ALB, so its analysis will see no traffic and abort every frontend canary (ADR 0008)."
          fi
          echo "Argo Rollouts: $(kubectl -n argo-rollouts get deploy -o jsonpath='{.items[0].spec.template.spec.containers[0].image}' 2>/dev/null || echo 'controller not found')"

      # Before any canary: the Prometheus the AnalysisTemplate queries (the address the chart
      # renders for this environment) must exist and answer, from where the analysis runs.
      # Otherwise every measurement is an Error and the canary aborts minutes later.
      # The Service must exist, then a one-off AnalysisRun with the same Prometheus provider and
      # address runs a trivial query (vector(1)): the Argo Rollouts controller makes the request,
      # pod to pod, exactly like a canary analysis. No image, no new pod; the run is deleted.
      # (Not the API server's service proxy: the EKS control plane may not reach pods on 9090.)
      - name: Prometheus for the canary analysis
        run: |
          merged=$(yq ea '. as $f ireduce ({}; . * $f)' helm-chart/values.yaml helm-chart/values-aws.yaml "helm-chart/values-${ENVIRONMENT}.yaml")
          if [ "$(yq '.frontend.canary.enabled and .frontend.canary.analysis.enabled' <<<"$merged")" != true ]; then
            echo "No frontend canary analysis for ${ENVIRONMENT}: nothing to check."
            exit 0
          fi
          addr=$(yq '.frontend.canary.analysis.prometheusAddress' <<<"$merged")
          # http://<service>.<namespace>.svc[.cluster.local]:<port>
          if ! [[ "$addr" =~ ^http://([a-z0-9-]+)\.([a-z0-9-]+)\.svc(\.cluster\.local)?:([0-9]+)/?$ ]]; then
            echo "::error::prometheusAddress ${addr} is not http://<service>.<namespace>.svc:<port>"; exit 1
          fi
          svc=${BASH_REMATCH[1]} pns=${BASH_REMATCH[2]} port=${BASH_REMATCH[4]}
          if ! kubectl -n "$pns" get svc "$svc" >/dev/null 2>&1; then
            echo "::error::The canary analysis queries ${addr}, but Service ${pns}/${svc} does not exist, so every canary would abort."
            echo "Prometheus Services in the cluster:"
            kubectl get svc -A -o json | jq -r '.items[] | select(.metadata.name | test("prometheus")) | "  \(.metadata.namespace)/\(.metadata.name) ports \([.spec.ports[].port] | map(tostring) | join(","))"'
            echo "Is monitoring installed? It needs the GRAFANA_ADMIN_PASSWORD secret (deploy workflow, job \"monitoring\")."
            exit 1
          fi
          # In the app namespace (where canary analyses run), or argo-rollouts before the first deploy.
          ans="$NS"
          [ -n "$(kubectl get namespace "$NS" --ignore-not-found -o name)" ] || ans=argo-rollouts
          run=$(kubectl -n "$ans" create -o jsonpath='{.metadata.name}' -f - <<YAML
          apiVersion: argoproj.io/v1alpha1
          kind: AnalysisRun
          metadata:
            generateName: prometheus-check-
            labels:
              app.kubernetes.io/managed-by: deploy-env
          spec:
            metrics:
            - name: prometheus-reachable
              count: 1
              successCondition: result[0] >= 1
              provider:
                prometheus:
                  address: ${addr}
                  query: vector(1)
          YAML
          )
          trap 'kubectl -n "$ans" delete analysisrun "$run" --ignore-not-found --wait=false >/dev/null 2>&1' EXIT
          phase=""
          for _ in $(seq 1 12); do
            sleep 5
            phase=$(kubectl -n "$ans" get analysisrun "$run" -o jsonpath='{.status.phase}')
            case "$phase" in Successful|Failed|Error|Inconclusive) break ;; esac
          done
          if [ "$phase" != Successful ]; then
            echo "::error::Prometheus at ${addr} does not answer the Argo Rollouts controller (check AnalysisRun ${ans}/${run}: ${phase:-not run within 60 s}), so every canary would abort."
            kubectl -n "$ans" get analysisrun "$run" -o json | jq -r '
              "message: \(.status.message // "-")",
              (.status.metricResults // [] | .[] | "metric \(.name): \(.phase // "?") \(.message // "")",
                (.measurements // [] | .[] | "  \(.phase // "?") value=\(.value // "-") \(.message // "")"))'
            [ -n "$phase" ] || echo "Not run at all: is the Argo Rollouts controller running? kubectl -n argo-rollouts get pods"
            exit 1
          fi
          echo "Prometheus at ${addr} answers the Argo Rollouts controller (AnalysisRun ${ans}/${run} Successful)."

      # Read-only evidence: how the frontend Deployment was last written. "helm Apply" means
      # Helm used server-side apply, "helm Update" client-side apply. kubectl leaves
      # managedFields out of its output unless --show-managed-fields is given.
      - name: Helm apply method (report)
        if: inputs.environment == 'dev'
        run: |
          {
            echo "### How boutique-dev objects were applied (deploy/frontend)"
            echo '```'
            if ! kubectl -n "$NS" get deployment frontend >/dev/null 2>&1; then
              echo "no frontend Deployment yet"
            elif ! json=$(kubectl -n "$NS" get deployment frontend -o json --show-managed-fields); then
              echo "could not read deploy/frontend from the cluster"
            else
              echo "manager  operation  time   (Apply = server-side, Update = client-side)"
              jq -r '(.metadata.managedFields // []) as $m
                | if ($m | length) == 0 then "no managedFields returned for deploy/frontend"
                  else $m[] | "\(.manager)  \(.operation)  \(.time)" end' <<<"$json"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Redis auth token for this environment (Terraform state -> Kubernetes Secret
      # "redis-auth", key "token"). Masked in the logs, never passed as a Helm value.
      - name: Redis auth Secret
        run: |
          token=$(jq -r --arg env "$ENVIRONMENT" '.outputs.redis_auth_tokens.value[$env] // empty' state.json)
          if [ -z "$token" ]; then
            echo "::error::No Redis auth token for '$ENVIRONMENT' in the Terraform outputs. Run the infra workflow (apply) first."
            exit 1
          fi
          echo "::add-mask::$token"
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NS" create secret generic redis-auth --from-literal=token="$token" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          echo "Secret redis-auth ready in $NS"

      # Shared by dev and prod; its IAM role (Pod Identity) comes from Terraform.
      # Installing it again with the same version changes nothing.
      #
      # --disable-openapi-validation: Helm's client-side check of the rendered objects
      # against the cluster's OpenAPI schema failed here with "error validating data: the
      # server is currently unable to handle the request", although every APIService was
      # Available. Cause: the EKS metrics-server add-on's OpenAPI cannot be converted to
      # protobuf, so /openapi/v2 answered 503 (RUNBOOK section 7); it is replaced by the chart
      # in the metrics-server step above. Remove the flag once eks-openapi-fix "check" shows protobuf OK
      # 10/10. Only Helm's client-side pass is skipped: the API server still validates
      # every object when it is applied.
      - name: AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller aws-load-balancer-controller \
            --disable-openapi-validation \
            --repo https://aws.github.io/eks-charts --version "$LBC_CHART_VERSION" \
            --namespace kube-system \
            --set clusterName="$CLUSTER" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --rollback-on-failure --timeout 5m
          kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=3m

      # The label makes the Load Balancer Controller add a readiness gate to new pods:
      # a pod only counts as ready once the ALB sees it healthy, so a rollout never
      # removes old pods before the new ones receive traffic.
      # Pod Security Standards: "baseline" is enforced (no privileged pods, host
      # namespaces or hostPath); "restricted" is audited and shown as a warning, so
      # anything that would fail the strict level is visible before it is enforced.
      - name: Namespace
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NS" elbv2.k8s.aws/pod-readiness-gate-inject=enabled --overwrite
          kubectl label namespace "$NS" --overwrite \
            pod-security.kubernetes.io/enforce=baseline \
            pod-security.kubernetes.io/enforce-version=latest \
            pod-security.kubernetes.io/warn=restricted \
            pod-security.kubernetes.io/audit=restricted

      # The namespace's PriorityClass (cluster-scoped, so the Argo CD project may not
      # create it, and the release never renders it; ADR 0006). Applied before anything
      # starts pods: a pod naming a missing PriorityClass is refused.
      - name: PriorityClass
        run: |
          helm template "$RELEASE" ./helm-chart --namespace "$NS" \
            -f helm-chart/values-aws.yaml \
            -f "helm-chart/values-${ENVIRONMENT}.yaml" \
            -f values-terraform.json \
            --set guardrails.priority.render=true \
            --show-only templates/priorityclass.yaml > priorityclass.yaml
          grep -q '^kind: PriorityClass$' priorityclass.yaml \
            || { echo "::error::no PriorityClass rendered for ${NS}"; exit 1; }
          kubectl apply -f priorityclass.yaml

      - name: Database migrations
        run: |
          set -euo pipefail
          db() { jq -r --arg env "$ENVIRONMENT" ".outputs.environments.value[\$env].$1" state.json; }
          secret_arn=$(db db_secret_arn)

          # Credentials: from Secrets Manager into a short-lived Kubernetes Secret,
          # through a private file (never on a command line, masked in the logs).
          aws secretsmanager get-secret-value --secret-id "$secret_arn" --query SecretString --output text > secret.json
          echo "::add-mask::$(jq -r .password secret.json)"
          umask 077
          {
            echo "DB_HOST=$(db db_host)"
            echo "DB_PORT=$(db db_port)"
            echo "DB_NAME=$(db db_name)"
            echo "DB_USER=$(jq -r .username secret.json)"
            echo "MYSQL_PWD=$(jq -r .password secret.json)"
          } > db.env
          rm -f secret.json
          kubectl -n "$NS" create secret generic db-migrate-credentials --from-env-file=db.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f db.env

          # The SQL files + the RDS certificate bundle (TLS with full verification).
          curl -sSfo rds-ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          kubectl -n "$NS" create configmap db-migrations --from-file=db/migrations --from-file=rds-ca.pem \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NS" delete job db-migrate --ignore-not-found --wait=true
          kubectl -n "$NS" apply -f deploy/k8s/db-migrate.yaml

          # Wait for success or failure (max 10 min), then show the Job's output.
          result=timeout
          for _ in $(seq 1 120); do
            if [ "$(kubectl -n "$NS" get job db-migrate -o jsonpath='{.status.succeeded}')" = "1" ]; then result=ok; break; fi
            if [ "$(kubectl -n "$NS" get job db-migrate -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')" = "True" ]; then result=failed; break; fi
            sleep 5
          done
          kubectl -n "$NS" logs job/db-migrate --all-containers || true
          [ "$result" = ok ] || { echo "::error::Database migration ${result}."; kubectl -n "$NS" describe job db-migrate; exit 1; }

      - name: Remove the database credentials from the cluster
        if: always()
        run: |
          [ -n "${NS:-}" ] && kubectl -n "$NS" delete secret db-migrate-credentials --ignore-not-found || true

      # Optional: emailservice also posts order outcomes to Slack (#boutique-orders).
      # GitHub secret -> Kubernetes Secret through a private file (never on a command line).
      # Without the GitHub secret the Kubernetes Secret is removed and nothing is posted.
      - name: Slack webhook for order notifications
        env:
          SLACK_ORDERS_WEBHOOK_URL: ${{ secrets.SLACK_ORDERS_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_ORDERS_WEBHOOK_URL" ]; then
            kubectl -n "$NS" delete secret emailservice-slack --ignore-not-found
            echo "No SLACK_ORDERS_WEBHOOK_URL secret: order notifications stay in the log and DynamoDB only."
            exit 0
          fi
          umask 077
          printf 'webhook-url=%s\n' "$SLACK_ORDERS_WEBHOOK_URL" > slack.env
          kubectl -n "$NS" create secret generic emailservice-slack --from-env-file=slack.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f slack.env
          echo "Order notifications will also be posted to Slack."

      - name: Remember the current release (for rollback)
        id: before
        if: steps.mode.outputs.argocd != 'true'
        run: |
          rev=$(helm -n "$NS" history "$RELEASE" --max 1 -o json 2>/dev/null | jq -r '.[0].revision // 0' || echo 0)
          echo "revision=${rev:-0}" >> "$GITHUB_OUTPUT"
          echo "Current revision: ${rev:-0}"

      # Upgrades use --rollback-on-failure (Helm 4's --atomic): if the pods aren't ready
      # within the timeout, Helm puts the previous release back by itself.
      # The very first install has nothing to go back to, so it only waits: a failed
      # first install stays in place, to be inspected (see "Diagnostics" below).
      - name: Deploy with Helm
        id: helm
        if: steps.mode.outputs.argocd != 'true'
        env:
          PREVIOUS: ${{ steps.before.outputs.revision }}
        run: |
          if [ "$PREVIOUS" = "0" ]; then safety=(--wait=watcher); else safety=(--rollback-on-failure); fi
          helm upgrade --install "$RELEASE" ./helm-chart \
            --namespace "$NS" \
            -f helm-chart/values-aws.yaml \
            -f "helm-chart/values-${ENVIRONMENT}.yaml" \
            -f values-terraform.json \
            --set images.tag="$TAG" \
            "${safety[@]}" --timeout 10m
          kubectl -n "$NS" get pods -o wide

      # From main: the image tag goes to Git (gitops/<env>/values.yaml), committed by a
      # GitHub App, the only bypass actor on the main ruleset. Not set up yet = not recorded.
      # GITOPS_APP_ID / GITOPS_APP_PRIVATE_KEY are set per environment (dev, prod).
      - name: GitHub App token (gitops commits)
        id: app
        if: github.ref == 'refs/heads/main' && vars.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main for the gitops commit
        if: steps.app.outcome == 'success'
        uses: actions/checkout@v5
        with:
          ref: main
          path: gitops-repo
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      # prod only gets what dev runs (ADR 0007): boutique-dev must be Synced and Healthy at
      # a commit whose gitops/dev/values.yaml has this run's image tag. That commit is what
      # prod is promoted from: main may only differ from it in gitops/ (gitops-commit.sh).
      - name: Promotion check (prod)
        id: promote
        if: inputs.environment == 'prod' && steps.mode.outputs.argocd == 'true' && steps.app.outcome == 'success'
        run: |
          dev=$(kubectl -n argocd get application boutique-dev --ignore-not-found -o json)
          if [ -z "$dev" ]; then
            echo "::error::prod is promoted from Argo CD's boutique-dev, which does not exist. Hand dev over first (argocd-install)."
            exit 1
          fi
          sync=$(jq -r '.status.sync.status // ""' <<<"$dev")
          health=$(jq -r '.status.health.status // ""' <<<"$dev")
          validated=$(jq -r '.status.sync.revision // ""' <<<"$dev")
          [ "$sync" = Synced ] && [ "$health" = Healthy ] || {
            echo "::error::boutique-dev is ${sync:-?}/${health:-?}, not Synced/Healthy: prod is not promoted."
            exit 1
          }
          dev_tag=$(git -C gitops-repo show "${validated}:gitops/dev/values.yaml" | sed '/^#/d' | jq -r '.images.tag // empty')
          if [ "$dev_tag" != "$TAG" ]; then
            echo "::error::dev runs ${dev_tag:-no tag} (at ${validated:0:12}), not ${TAG}: prod only gets an image tag that already runs in dev."
            exit 1
          fi
          echo "validated=${validated}" >> "$GITHUB_OUTPUT"
          echo "dev runs ${TAG} at ${validated:0:12}: prod is promoted from that commit."

      # Argo CD: the commit is the deploy. dev: Argo CD syncs main. prod: the commit is made
      # on main, then the promotion branch is moved to it (deploy/argocd/boutique-prod.yaml).
      - name: Commit the image tag (Argo CD deploys it)
        id: gitops
        if: steps.mode.outputs.argocd == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GITOPS_ENV: ${{ inputs.environment }}
          VALIDATED: ${{ steps.promote.outputs.validated }}
        run: |
          if [ "$ENVIRONMENT" = prod ]; then
            bash deploy/gitops-commit.sh promote "$VALIDATED"
          else
            bash deploy/gitops-commit.sh commit
          fi

      # prod waits for exactly the promoted commit (its branch never follows main by itself).
      - name: Wait for Argo CD (Synced and Healthy)
        if: steps.mode.outputs.argocd == 'true'
        run: |
          [ "$ENVIRONMENT" != prod ] || export ARGOCD_WAIT_EXACT=1
          bash deploy/argocd-wait.sh "boutique-${ENVIRONMENT}" "${{ steps.gitops.outputs.revision }}"
          kubectl -n "$NS" get pods -o wide

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          # 1) The ALB address (the controller creates it on the first deploy, ~2 min).
          host=""
          for _ in $(seq 1 60); do
            host=$(kubectl -n "$NS" get ingress frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$host" ] && break
            sleep 5
          done
          [ -n "$host" ] || { echo "::error::The ALB was not created. Check: kubectl -n kube-system logs deploy/aws-load-balancer-controller"; kubectl -n "$NS" describe ingress frontend; exit 1; }
          # 2) With a domain: point dev./shop.<domain> at this ALB, and test over HTTPS with
          #    that name (the certificate is checked). --connect-to goes straight to the ALB,
          #    so the test doesn't wait for DNS to reach the runner.
          if [ -n "$TLS_HOST" ]; then
            bash deploy/dns-record.sh upsert "$TLS_HOST" "$host"
            echo "url=https://${TLS_HOST}" >> "$GITHUB_OUTPUT"
            check() { curl -sS -o /dev/null -w '%{http_code}' --max-time 10 --connect-to "${TLS_HOST}:443:${host}:443" "https://${TLS_HOST}$1" || true; }
          else
            echo "url=http://${host}" >> "$GITHUB_OUTPUT"
            check() { curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://${host}$1" || true; }
          fi

          # 3) The shop answers through the ALB (target health can take a few minutes).
          code=""
          for _ in $(seq 1 60); do
            code=$(check /)
            [ "$code" = 200 ] && break
            sleep 10
          done
          [ "$code" = 200 ] || { echo "::error::http://${host}/ answered ${code:-nothing}"; exit 1; }
          # Each page gets 5 tries: one slow answer during a rollout is not a failure,
          # a page that keeps failing is.
          for path in /_healthz /product/OLJCESPC7Z /cart; do
            for try in 1 2 3 4 5; do
              c=$(check "$path"); echo "GET ${path} -> ${c} (try ${try})"
              [ "$c" = 200 ] && break
              sleep 5
            done
            [ "$c" = 200 ] || { echo "::error::GET ${path} -> ${c} after 5 tries"; exit 1; }
          done

          if [ -n "$TLS_HOST" ]; then
            redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "http://${host}/" || true)
            echo "http:// -> ${redirect} (expected: 301 to https)"
          fi

          # 4) inventoryservice reads DynamoDB (proves Pod Identity works).
          kubectl -n "$NS" port-forward svc/inventoryservice 18080:80 >/dev/null 2>&1 &
          pf=$!
          sleep 5
          stock=$(curl -sS --max-time 10 http://127.0.0.1:18080/stock || true)
          kill "$pf" || true
          echo "inventory /stock: ${stock}"
          jq -e 'length > 0' <<<"$stock" >/dev/null || { echo "::error::inventoryservice /stock returned no stock"; exit 1; }

      # Helm deployed this environment and it passed: record that version in Git, so Argo CD
      # starts from what runs when argocd-install.yml creates the Application. prod: also
      # moves the promotion branch to it (the commit Helm deployed from, plus gitops/ only).
      - name: Record the image tag in Git
        if: steps.mode.outputs.argocd != 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GITOPS_ENV: ${{ inputs.environment }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GITOPS_APP_ID is not set for ${ENVIRONMENT}: the image tag is not recorded in Git (docs/week3/ARGOCD.md)."
            exit 0
          fi
          if [ "$ENVIRONMENT" = prod ]; then
            # Helm already deployed prod and it passed: a refused recording (main moved
            # outside gitops/ meanwhile) must not fail the job, or "Roll back" would undo a
            # good deploy. The next prod deploy records it.
            bash deploy/gitops-commit.sh promote "$GITHUB_SHA" ||
              echo "::warning::prod was deployed by Helm but not recorded in Git (see the error above); the next prod deploy will."
          else
            bash deploy/gitops-commit.sh commit
          fi

      # Why pods aren't ready: status, scheduling/probe events, and the logs of
      # containers that crashed. Printed in the log and on the run's Summary page.
      - name: Diagnostics
        if: failure() && env.NS != ''
        run: |
          {
            echo "### Diagnostics: ${NS}"
            echo '```'
            bash deploy/diagnose.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Argo CD deploys: why the canary stopped, captured BEFORE the rollback below resets the
      # Rollout, removes the canary pods and replaces the loadgenerator (events expire too).
      # Rollout status, AnalysisRuns with their measured values, canary pods, loadgenerator log.
      # Read-only, no Secret is read.
      - name: Canary report (before rollback)
        if: failure() && steps.mode.outputs.argocd == 'true' && env.NS != ''
        run: |
          {
            echo "### Canary report: ${NS}"
            echo '```'
            bash deploy/rollouts-report.sh "$NS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Pods were ready but the shop doesn't work: put the previous release back.
      - name: Roll back
        if: failure() && steps.helm.outcome == 'success' && steps.before.outputs.revision != '0'
        run: |
          echo "::warning::Smoke test failed, rolling back ${RELEASE} to revision ${{ steps.before.outputs.revision }}."
          helm -n "$NS" rollback "$RELEASE" "${{ steps.before.outputs.revision }}" --wait --timeout 10m

      # Argo CD: revert the tag commit; Argo CD syncs the previous version back.
      - name: Roll back (Argo CD)
        if: failure() && steps.gitops.outputs.commit != '' && inputs.environment == 'dev'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FAILED: ${{ steps.gitops.outputs.commit }}
        run: |
          echo "::warning::dev failed after ${FAILED:0:12}, reverting that commit."
          revision=$(bash deploy/gitops-commit.sh revert "$FAILED")
          bash deploy/argocd-wait.sh boutique-dev "$revision"

      # prod: put the promotion branch back where it was (chart and tag together) and revert
      # the tag commit on main, so Git says what runs. Also when only the chart moved.
      - name: Roll back (Argo CD, prod)
        if: failure() && inputs.environment == 'prod' && steps.gitops.outputs.previous != '' && steps.gitops.outputs.revision != steps.gitops.outputs.previous
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GITOPS_ENV: prod
          PREVIOUS: ${{ steps.gitops.outputs.previous }}
          FAILED: ${{ steps.gitops.outputs.commit }}
        run: |
          echo "::warning::prod failed at ${{ steps.gitops.outputs.revision }}, putting it back on ${PREVIOUS:0:12}."
          revision=$(bash deploy/gitops-commit.sh restore "$PREVIOUS" $FAILED)
          ARGOCD_WAIT_EXACT=1 bash deploy/argocd-wait.sh boutique-prod "$revision"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${ENVIRONMENT}: \`${TAG}\`"
            echo
            echo "- Shop: ${{ steps.smoke.outputs.url || 'not available' }}"
            echo "- Namespace: \`${NS:-?}\`"
            echo
            echo '```'
            if [ "${{ steps.mode.outputs.argocd }}" = true ]; then
              kubectl -n argocd get application "boutique-${ENVIRONMENT}" \
                -o custom-columns='APPLICATION:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision' 2>/dev/null || true
            else
              helm -n "${NS:-x}" history "$RELEASE" --max 5 2>/dev/null || echo "no release yet"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
