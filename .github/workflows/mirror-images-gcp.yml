name: mirror-images-gcp

# Copies the images prod runs from ECR into Artifact Registry (ADR 0014, decision 5), so GKE
# pulls from GCP and never needs an AWS credential (ECR tokens expire after 12 hours):
#   - the 10 services and the loadgenerator, by digest, with their cosign signature and SBOM
#     attestation, verified in ECR before the copy and in Artifact Registry after it, with the
#     identity and issuer of docs/week3/IMAGE-SIGNING.md;
#   - redis and busybox (unsigned, from Docker Hub) at the digests the chart pins.
# Which images: the tag prod runs, read from the promotion branch env/prod (what Argo CD
# deploys, ADR 0007), the same tag the deploy workflow signed and verified.
#
# Manual only (Actions > mirror-images-gcp > Run workflow, on main): GKE serves no real traffic
# yet. Copies are idempotent: an image already mirrored is checked again, not copied twice.
# The logs are public: no digest is printed, and the AWS account and GCP project IDs are masked.

on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS and GCP; Sigstore verification needs no token
  contents: read

concurrency:
  group: mirror-images-gcp
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # The same tools and signer as the deploy workflow (deploy.yml): keep them in step.
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 # cosign-linux-amd64
  CRANE_VERSION: "0.20.6"
  CRANE_SHA256: c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127 # go-containerregistry_Linux_x86_64.tar.gz
  SIGNER_IDENTITY: https://github.com/ngems1/Sec-GitOps-platform/.github/workflows/deploy.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  mirror:
    name: Mirror prod images to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-east1' }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      # The AWS deploy role and gha-deploy both trust refs/heads/main only (for jobs outside
      # the dev/prod environments): fail early and clearly.
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run mirror-images-gcp from main: the AWS and GCP deploy identities trust only main."
          exit 1

      - uses: actions/checkout@v5

      - name: Check the variables are configured
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOY_SA AWS_DEPLOY_ROLE_ARN; do
            [ -n "${!v}" ] || missing="${missing} ${v}"
          done
          [ -z "$missing" ] || { echo "::error::Missing:${missing} (terraform-gcp-bootstrap/README.md, docs/week3/BOOTSTRAP.md)."; exit 1; }
          echo "::add-mask::${GCP_PROJECT_ID}"
          account=$(cut -d: -f5 <<<"$AWS_DEPLOY_ROLE_ARN")
          [ -n "$account" ] && echo "::add-mask::${account}"
          echo "AR_REGISTRY=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/boutique" >> "$GITHUB_ENV"

      # What prod runs: images.repository and images.tag of the promotion branch.
      - name: The images prod runs (env/prod)
        run: |
          git fetch --quiet --depth=1 origin env/prod
          values=$(git show FETCH_HEAD:gitops/prod/values.yaml | grep -v '^#')
          registry=$(jq -r '.images.repository // empty' <<<"$values")
          tag=$(jq -r '.images.tag // empty' <<<"$values")
          [[ "$registry" =~ ^([0-9]{12})\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+$ ]] \
            || { echo "::error::env/prod: images.repository is not an ECR repository"; exit 1; }
          echo "::add-mask::${BASH_REMATCH[1]}"
          [[ "$tag" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::env/prod: images.tag is not a 12-character commit SHA"; exit 1; }
          { echo "ECR_REGISTRY=${registry}"; echo "IMAGE_TAG=${tag}"; } >> "$GITHUB_ENV"
          echo "prod runs tag ${tag}"

      - name: Install cosign and crane (checked by SHA-256)
        run: |
          mkdir -p "$HOME/bin"; cd "$HOME/bin"
          curl -sSfLo cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          curl -sSfLo crane.tgz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar xzf crane.tgz crane && rm crane.tgz
          chmod +x cosign crane
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Read-only use: the job only pulls from ECR. The deploy role is the one a manual run on
      # main may assume (the plan role trusts pull requests only), as in deploy.yml.
      - name: Configure AWS credentials (deploy role, ECR pulls only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token # a 1-hour token for docker login, masked by the action

      - name: Log in to Artifact Registry
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev" <<<"$TOKEN" > /dev/null

      - name: Mirror and verify
        run: bash deploy/mirror-images.sh "$ECR_REGISTRY" "$IMAGE_TAG" "$AR_REGISTRY"
