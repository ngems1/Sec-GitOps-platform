name: load-test

# Simulated shoppers against the DEV shop for a fixed time; stops by itself.
#   load:   steady shoppers, makes the Grafana dashboard move.
#   stress: stepped ramp-up over several Locust pods, finds the breaking point
#           (p95 latency and errors climbing on the dashboard). Prod is never tested.
# Actions > load-test > Run workflow. The Locust summary is on the run's Summary page.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "load = steady shoppers (dashboard demo); stress = ramp up until the shop struggles"
        type: choice
        options: [load, stress]
        default: load
      users:
        description: "load mode: simulated shoppers"
        type: choice
        options: ["5", "10", "20", "50"]
        default: "10"
      max_users:
        description: "stress mode: shoppers at the top of the ramp (busy shoppers, ~1 request/s each)"
        type: choice
        options: ["100", "200", "400", "800"]
        default: "200"
      minutes:
        description: "Duration (minutes)"
        type: choice
        options: ["5", "10", "15", "30"]
        default: "10"
      restock:
        description: "Reset dev stock first: normal = 50 per product (Mug 2), unlimited = 100000 (use for stress)"
        type: choice
        options: [normal, unlimited, none]
        default: normal

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

concurrency:
  group: load-test # one load test at a time
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Read Terraform outputs
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/week3/terraform.tfstate" state.json --only-show-errors
          {
            echo "CLUSTER=$(jq -r '.outputs.cluster_name.value' state.json)"
            echo "NS=$(jq -r '.outputs.environments.value.dev.namespace' state.json)"
            echo "INVENTORY_TABLE=$(jq -r '.outputs.environments.value.dev.inventory_table' state.json)"
          } >> "$GITHUB_ENV"
          rm -f state.json

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Load test
        env:
          MODE: ${{ inputs.mode }}
          USERS: ${{ inputs.users }}
          MAX_USERS: ${{ inputs.max_users }}
          MINUTES: ${{ inputs.minutes }}
          RESTOCK: ${{ inputs.restock }}
        run: |
          {
            if [ "$MODE" = stress ]; then echo "### Stress test: ramp to ${MAX_USERS} shoppers, ${MINUTES} min, dev"
            else echo "### Load test: ${USERS} shoppers, ${MINUTES} min, dev"; fi
            echo '```'
            bash deploy/load-test.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
